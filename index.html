<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="description" content="FGI Delphi AHP 전문가 설문 참여자 로그인">
  <title>FGI · Delphi · AHP 전문가 설문</title>
  <style>
    :root{--navy:#10233f;--blue:#2357d9;--blue2:#1742ad;--ink:#17243a;--muted:#66758a;--line:#d8e0ec;--bg:#f3f6fa;--white:#fff;--danger:#b42318;--ok:#087443}
    *{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at 85% 5%,#dce8ff 0,transparent 27%),var(--bg);font-family:Pretendard,"Noto Sans KR",system-ui,-apple-system,sans-serif;color:var(--ink)}
    .wrap{width:min(960px,calc(100% - 32px));margin:36px auto}.hero{background:linear-gradient(135deg,var(--navy),var(--blue));border-radius:28px;padding:42px 46px;color:#fff;box-shadow:0 20px 55px rgba(28,54,95,.16);position:relative;overflow:hidden}.hero:after{content:"";position:absolute;width:330px;height:330px;border:1px solid rgba(255,255,255,.14);border-radius:50%;right:-90px;top:-190px}.tag{display:inline-block;border:1px solid rgba(255,255,255,.42);border-radius:999px;padding:5px 11px;font-size:13px}.hero h1{font-size:clamp(29px,5vw,47px);line-height:1.2;margin:16px 0 10px;letter-spacing:-.03em}.hero p{margin:0;color:#dfe9ff}.card{background:var(--white);border:1px solid rgba(216,224,236,.9);border-radius:22px;padding:32px;box-shadow:0 9px 30px rgba(27,48,82,.07)}.login{max-width:560px;margin:24px auto 0}.card h2{margin:0 0 8px;font-size:25px}.muted{color:var(--muted);line-height:1.65}label{display:block;font-weight:800;margin-top:19px}input{width:100%;margin-top:8px;border:1px solid #b9c5d5;border-radius:12px;padding:14px;font:inherit;color:var(--ink);outline:none}input:focus{border-color:var(--blue);box-shadow:0 0 0 4px rgba(35,87,217,.12)}button{border:0;border-radius:12px;padding:14px 20px;font:inherit;font-weight:900;cursor:pointer}.primary{width:100%;margin-top:20px;background:var(--blue);color:#fff}.primary:hover{background:var(--blue2)}.primary:disabled{opacity:.62;cursor:wait}.secondary{background:#e9eef7;color:var(--ink)}.message{min-height:23px;color:var(--danger);font-size:14px;margin:12px 0 0}.test{margin-top:20px;padding:14px 16px;background:#f4f7fb;border-radius:12px;color:var(--muted);font-size:14px;text-align:center}.hidden{display:none!important}.success{max-width:650px;margin:24px auto 0;text-align:center;padding:44px 34px}.check{width:70px;height:70px;margin:0 auto 20px;border-radius:50%;background:#e7f7ef;color:var(--ok);display:grid;place-items:center;font-size:36px;font-weight:900}.who{margin:22px auto;padding:16px;background:#f5f8fc;border-radius:14px;max-width:420px}.who strong,.who span{display:block}.who strong{font-size:21px}.who span{margin-top:3px;color:var(--muted)}footer{text-align:center;color:#8491a4;font-size:12px;margin:30px 0}@media(max-width:650px){.wrap{width:min(100% - 20px,960px);margin:12px auto}.hero{padding:30px 24px;border-radius:20px}.card{padding:24px;border-radius:18px}}
  </style>
</head>
<body>
  <main class="wrap">
    <header class="hero">
      <span class="tag">전문가 조사</span>
      <h1>FGI · Delphi · AHP<br>전문가 설문</h1>
      <p>참여자 본인 확인 후 설문을 진행합니다.</p>
    </header>

    <section id="loginView" class="card login">
      <h2>참여자 로그인</h2>
      <p class="muted">안내받은 성명과 휴대전화 번호 뒤 4자리를 입력해 주세요.</p>
      <form id="loginForm" novalidate>
        <label for="name">성명</label>
        <input id="name" name="name" autocomplete="name" required placeholder="예: 홍길동">
        <label for="last4">휴대전화 번호 뒤 4자리</label>
        <input id="last4" name="last4" inputmode="numeric" maxlength="4" pattern="[0-9]{4}" required placeholder="예: 1234">
        <p id="message" class="message" role="alert"></p>
        <button id="loginBtn" class="primary" type="submit">로그인</button>
      </form>
      <div class="test">테스트 계정: <strong>홍길동 / 1234</strong></div>
    </section>

    <section id="successView" class="card success hidden">
      <div class="check">✓</div>
      <h2>본인 확인이 완료되었습니다</h2>
      <div class="who"><strong id="participantName"></strong><span id="participantOrg"></span></div>
      <p class="muted">FGI · Delphi · AHP 설문 문항은 다음 제작 단계에서 이 화면에 연결됩니다.</p>
      <button id="logoutBtn" class="secondary" type="button">로그아웃</button>
    </section>

    <footer>참여자 정보는 공개 GitHub 저장소에 저장되지 않으며, 별도 보안 서버에서 확인합니다.</footer>
  </main>
  <script>
    (()=>{
      const API='https://ajfamqidzwtlwmtargpi.supabase.co/functions/v1/survey-api';
      const loginView=document.querySelector('#loginView'),successView=document.querySelector('#successView');
      const form=document.querySelector('#loginForm'),msg=document.querySelector('#message'),btn=document.querySelector('#loginBtn');
      let token=sessionStorage.getItem('fgiSurveyToken')||'';
      async function call(action,data={}){
        const res=await fetch(API,{method:'POST',headers:{'Content-Type':'application/json',...(token?{Authorization:`Bearer ${token}`}:{})},body:JSON.stringify({action,...data})});
        const body=await res.json().catch(()=>({}));
        if(!res.ok)throw new Error(body.error||'요청을 처리하지 못했습니다.');
        return body;
      }
      function showParticipant(participant){
        document.querySelector('#participantName').textContent=participant.name;
        document.querySelector('#participantOrg').textContent=participant.organization||'';
        loginView.classList.add('hidden');successView.classList.remove('hidden');
      }
      form.addEventListener('submit',async e=>{
        e.preventDefault();msg.textContent='';
        const name=document.querySelector('#name').value.trim();
        const last4=document.querySelector('#last4').value.trim();
        if(!name||!/^\d{4}$/.test(last4)){msg.textContent='이름과 숫자 4자리를 정확히 입력해 주세요.';return;}
        btn.disabled=true;btn.textContent='확인 중...';
        try{const result=await call('login',{name,last4});token=result.token;sessionStorage.setItem('fgiSurveyToken',token);showParticipant(result.participant)}
        catch(err){msg.textContent=err.message}
        finally{btn.disabled=false;btn.textContent='로그인'}
      });
      document.querySelector('#logoutBtn').addEventListener('click',()=>{token='';sessionStorage.removeItem('fgiSurveyToken');successView.classList.add('hidden');loginView.classList.remove('hidden');form.reset();msg.textContent=''});
      if(token)call('me').then(r=>showParticipant(r.participant)).catch(()=>{token='';sessionStorage.removeItem('fgiSurveyToken')});
    })();
  </script>
</body>
</html>

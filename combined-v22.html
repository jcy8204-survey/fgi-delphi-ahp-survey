데이터 수집·분석 기반 재난 유형별 상관관계 도출\n• GIS 기반 재난 데이터 종류별 주제도 및 재난 유형별 시각화 표출\n• 재난 사고 및 접수 다발 지역 재난 예방지역 설정\n• 재난부서 정보 제공(계정 부여) 및 재난 예방 활동·예방 교육 지원\n\n[목표]\n• 재난 예방 순찰과 예방 교육을 통한 재난 안전 체감도 제고 및 도민의 재산·인명 사고 감소\n\n[현재 수준]\n• GIS 기반 재난 유형별 시각화 표출 및 재난 예방지역 설정 서비스 구축 완료\n• 전북특별자치도청 데이터허브 플랫폼 기반 운영, 향후 도시안전망 연계 시군 데이터 수집 대상 확대 계획\n• 경찰청 112 신고데이터 등 일부 재난안전 데이터의 타 시도 제공 사례 존재에도 미제공되는 한계 존재\n• 데이터 표준화가 각 시도별로 자체 정의됨에 따른 향후 데이터허브 목적 달성의 어려움 예상\n\n[적용 기술]\n• NGSI-LD, 클라우드 네이티브(쿠버네티스), API 게이트웨이, RPA, GIS, 빅데이터 분석\n\n[서비스 대상]\n• 재난부서, 도민, 지방자치단체\n\n[적용 사례]\n• 전북특별자치도\n\n[데이터허브 2.0 연계 가능성]\n• (1단계) 소방본부 MDT 데이터(재난 접수일시, 재난 유형, 신고자명, 신고자 번호, 재난 위치, 신고 접수 내용), 날씨데이터(기온, 풍속, 습도, 지면온도), 도시안전망 데이터(112 순찰차, 112 긴급수배차량, 119 긴급구조 표준, 재난상황대응(NDMS), 법무부 위치추적, 시설물 조회) 수집·통합\n• (2단계) 계절별·요일별·시간대별·재난 유형별 상관관계 분석, GIS 기반 재난 유형별 시각화 및 데이터 정합성 확보\n• (3단계) 재난부서 정보 제공(계정 부여), 재난 예방지역 설정, 재난 예방 활동 및 예방 교육 서비스 활용\n\n[입력 데이터]\n• 재난 접수일시, 재난 유형, 접수자명, 신고자 번호, 재난 위치, 신고 접수 내용, 기온, 풍속(m/s), 습도, 지면온도, 소방긴급구조 정보, 기상특보 통보문, 지진 통보문, 112 순찰차 정보, 112 긴급수배차량 정보, 119 긴급구조 표준 정보, 재난상황대응(NDMS) 정보, 법무부 위치추적 정보, 시설물 조회 정보\n\n[출력 데이터]\n• GIS 기반 재난 유형별 시각화 정보, 재난 예방지역 설정 정보, 수집 데이터 통계, 재난부서 제공 데이터\n\n[후보 KPI]\n• 재난 예방지역 설정 건수(건)\n• 도시안전망 연계 필수 데이터 지정 건수(건)\n• 재난부서 데이터 제공 건수(건)\n\n[확산 리스크 (1차 판정)]\n• 데이터 표준화가 각 시도별로 자체 정의됨에 따른 데이터허브 목적 달성상 표준 차이\n• 경찰청 등 일부 재난안전 데이터의 타 지자체 제공 사례가 있음에도 미제공되는 중앙행정기관 간 업무협조 체계 미비","보건·의료·복지카드 번호 37고독사 예방 통합 모니터링 시스템별도 기기 설치 없이 통신 수·발신 데이터와 자동 안부전화로 취약계층 안전을 상시 확인하는 고독사 예방 서비스서비스 대상고독사 위험 1인가구·고립가구·독거노인, 지자체 복지부서·보훈기관 담당자적용 사례전국 27개 지자체 및 국가보훈부 '보보안심콜' 운영, 약 5만 명 관리주요 기능대상자별 맞춤 주기 통신 수·발신 활동 모니터링통신 이력 없으면 자동 안부전화(ACS) 최대 2회 발신미응답 시 확인요청 목록 문자·이메일 전달고위험군 문열림센서·스마트플러그·앱 연계앱 SOS, 신고 위치 인근 CCTV 최대 5개 연계목표데이터 기반 상시 안부확인으로 복지사각지대 고독사 예방 및 안전망 강화서비스 배경1인가구·사회적 고립가구 증가로 고독사 위험 확대기존 IoT 돌봄은 기기 설치·유지관리 부담, 한정된 복지 인력현재 수준2018년부터 공공기관 도입, 상용 서비스 단계GS인증·특허·조달청 혁신제품(2023년) 보유27개 지자체·국가보훈부 운영, 클라우드형·서버 구축형 적용적용 기술AI 통신활동 패턴 분석AI 위험도 예측대상자 자동 선별ACS 자동발신응답 결과 분석지능형 관제 대시보드자동 알림데이터허브 연계데이터허브 연계 가능(원문 체크 표시)참여 조건: 관계 법령상 데이터 처리 근거 및 기관 간 협약 마련범위: 개인식별정보 제외 상태·안부확인·통계정보를 표준 API로 연계입력 데이터대상자 기본정보·서비스 설정위험군(저/중/고)일별 통신 수·발신 횟수걸음수문열림 횟수전력변화 횟수안부전화 응답 결과담당자 조치 이력출력 데이터통신활동 유무 판정 결과확인요청 대상자 선별 목록ACS 발신·응답 이력대상자별 위험도 판정생활데이터 이상징후 결과통합 모니터링 현황알림 발송 내역담당자 조치 이력후보 KPI카드에 기재 없음확산 리스크카드에 기재 없음카드 원문 전체 보기[서비스 개요]\n• 똑똑안부확인서비스는 별도의 기기 설치 없이 통신 수·발신 데이터를 활용해 취약계층의 안전을 상시 확인하는 고독사 예방 서비스\n   - ① 모니터링 — 대상자별 맞춤 주기로 통신 수·발신 활동을 자동 감지\n   - ② 확인 — 통신 활동이 없으면 자동 안부전화로 안전 여부 확인\n   - ③ 대응 — 미응답 시 담당자에게 즉시 확인요청 정보 전달, 신속 조치(+ 확장) 위험도에 따라 앱, 문열림센서, 스마트플러그를 연계해 생활데이터 기반 통합\n\n[서비스 배경]\n[늘어나는 위험]\n   - 1인가구와 사회적 고립가구의 증가로 고독사 위험이 확대되고 있어 위험을 조기에 포착하는 상시 모니터링 체계가 요구\n[감당 어려운 현장]\n   - 한정된 복지 인력으로 다수 대상자를 매일 확인하는 것은 현실적으로 불가능해, 저비용·대규모 관리와 대상자별 맞춤 적용을 동시에 만족하는 안부확인 서비스 필요\n[기존 방식의 벽]\n   - 기존 IoT 돌봄서비스는 기기 설치와 유지관리 부담과 일상생활 방해라는 한계\n\n[주요 기능]\n• [상시 안전 감지]◦대상자별 맞춤 주기로 통신 수·발신 활동을 모니터링하여 통신 활동 유무 확인\n   - 통신 이력이 없으면 자동 안부전화(ACS)를 최대 2회 발신해 응답 확인\n[신속 대응 연계]\n   - 미응답 시 확인요청 대상자 목록을 문자, 이메일로 담당자에게 즉시 전달\n   - 관리자 웹에서 대상자 현황, 통신활동, 안부전화 결과, 조치 이력을 통합 관리\n[정밀 모니터링 & 능동 신고]\n   - 고위험군은 문열림센서, 스마트플러그, 앱 등 생활데이터를 선택 연계해 정밀 모니터링\n   - 앱 응급호출(SOS)로 능동신고 가능, 신고 위치 기반 인근 CCTV 최대 5개 연계로 즉시 대응\n\n[목표]\n• 데이터 기반 상시 안부확인으로 복지사각지대의 고독사를 예방하고 지역사회 안전망을 강화\n[조기 발견]\n   - 통신 수·발신 데이터와 자동 안부확인으로 고독사 위험신호를 조기에 포착\n[맞춤 관리]\n   - 대상자 특성과 위험도에 따라 생활데이터를 연계한 통합 모니터링 제공\n[신속 대응]\n   - 위험 감지 시 담당자 연계 및 능동적 대응 체계로 신속하게 조치\n\n[현재 수준]\n   - 2018년부터 공공기관에서 도입, 운영 중인 상용 서비스 단계\n   - GS인증과 관련 특허, 조달청 혁신제품(2023년)을 보유한 고독사 예방 통합서비스\n   - 전국 27개 지방자치단체와 국가보훈부에서 운영 중이며 약 5만 명 규모의 대상자를 관리\n   - 지방자치단체의 정보화 환경과 운영방식에 따라 클라우드형 또는 기관 내 서버 구축형으로 적용 가능\n\n[적용 기술]\n[AI 기반 통신활동 패턴 분석 기술]\n   - 대상자별 통신 수·발신 데이터를 학습해 평소 생활패턴을 모델링하고 개인별 최적 안부확인 주기를 산출 및 조정\n[AI 위험도 예측 및 대상자 자동 선별 기술]\n   - 통신활동 이력과 생활데이터를 종합 분석해 고독사 위험도를 스코어링하고, 이상징후가 감지된 대상자를 자동 선별과 우선순위화\n[ACS 자동발신 및 응답 결과 지능형 분석 기술]\n   - 자동 안부전화 발신과 응답/미응답 결과를 수집, 분석해 대응 시급도를 자동 판정\n[지능형 관제 대시보드 및 자동 알림 기술]\n   - 확인요청 대상자 자동 알림과 함께 대상자 현황, 위험도, 조치 이력을 통합 시각화하고 우선 대응 대상을 자동 제시\n\n[서비스 대상]\n   - 고독사 위험이 있는 1인가구, 사회적 고립가구, 독거노인, 중장년 1인가구\n   - 지방자치단체 복지부서, 보건 또는 복지기관 및 국가보훈기관 등 대상자의 안전을 확인하고 관리하는 공공기관 담당자\n\n[적용 사례]\n   - 전국 27개 지방자치단체에서 지역 내 고독사 위험가구, 독거노인 및 중장년 1인가구 등을 대상으로 운영\n   - 국가보훈부‘보보안심콜’을 통해 전국 27개 지방보훈관서의 국가유공자를 대상으로 안부확인 서비스 운영\n   - 약 5만 명 규모 대상자의 설정 주기별 통신활동 여부를 자동으로 확인하고 통신 수·발신 이력이 없는 대상자를 선별하여 담당자의 전화 및 방문 확인 지원\n\n[데이터허브 연계 여부 및 참여 조건]\n   - 데이터허브 연계 가능 여부(☑체크): ☑ 가능 □ 불가(사유 )\n   - 참여 조건 : 개인정보보호법 등 관계 법령에 따른 데이터 처리 근거 및 기관 간 협약 마련\n   - 연계 범위: 개인식별정보를 제외한 대상자 상태정보, 안부확인 결과, 연계 서비스별 생활데이터 변화정보 및 통계정보 등을 기관 간 협의에 따라 표준 API 방식으로 연계 가능\n   - 세부 연계항목, 제공주기, 보유기간 및 이용목적은 데이터 제공기관과 수요기관 간 협의를 통해 결정\n\n[입력 데이터]\n[대상자 기본정보 및 서비스 설정정보]\n   - 대상자 이름, 생년월일, 연락처, 주소, 복지수급정보, 위험군(저/중/고), 담당기관, 담당자, 주기 등\n[대상자 생활 데이터]\n   - 일별 발생한 수·발신 횟수, 걸음수, 문열림횟수, 전력변화 횟수\n[담당자 조치 이력]\n   - 자동 안부전화 발신 및 응답 결과\n   - 담당자의 전화 확인, 방문 확인 및 사후조치 이력\n\n[출력 데이터]\n[안부확인 결과 데이터]\n   - 대상자별 주기 내 통신활동 유무 판정 결과\n   - 확인요청 대상자 자동 선별 목록 (미활동, 미응답 대상)\n   - 자동 안부전화(ACS) 발신 이력 및 응답/미응답 결과\n[위험 판정·모니터링 데이터]\n   - 대상자별 위험도 판정 결과 (생활데이터 기반, 위험군별 상태값)\n   - 생활데이터 이상징후 감지 결과 (걸음수, 문열림, 전력변화 등 패턴 이탈 여부)\n   - 대상자별 통합 모니터링 현황 (통신, 생활데이터 종합 상태)\n[대응·관리 데이터]\n   - 담당자 확인요청 알림 발송 내역 (문자, 이메일, 발송 시각, 수신자)\n   - 담당자 조치 이력 (전화 확인, 방문 확인, 사후조치 결과 및 처리 상태)\n   - 관리자 대시보드 통계 (대상자 현황, 안부확인 결과, 조치율 등 집계)","주거카드 번호 17AI기반 빈집 분석AI 데이터 분석과 현장 실태조사를 연계해 선제적으로 빈집을 진단·관리하는 서비스서비스 대상지자체, 현장조사 인력, 빈집 대상 지역 주민적용 사례울산광역시주요 기능빈집 분석 AI 알고리즘 기반 빈집 분석클러스터링 기반 효율적 조사객관적 지수 기반 빈집 탐지·판단 지원위험지도 가시화를 통한 주민참여 유도목표지역 맞춤형 도시여건 재생 및 안전한 정주여건 조성을 통한 슬럼화 예방·주민 안전 실현현재 수준AI 기반 빈집 발생관리 솔루션 구축 단계, 울산시 시범솔루션 도입소유주 불분명, 데이터 공유 미흡, 분석 데이터 종류 제한적용 기술AI데이터 분석클러스터링위험지도공간정보데이터허브 연계기보유·신규 수집 빈집 특화 및 에너지·환경·공간 데이터 수집·통합빈집 분석 AI·클러스터링, 지수 기반 탐지·판단, 통합데이터 분석빈집 선제 관리, 효율적 현장조사, 위험지도 기반 주민참여 활용입력 데이터기보유 데이터신규 수집데이터에너지 데이터환경 데이터공간 데이터빈집 관련 데이터출력 데이터빈집 특화 데이터빈집 분석 결과빈집 예측·진단 결과빈집 위험지도빈집 판단 지원정보후보 KPI빈집 탐지 정확도(%)빈집 현장조사 효율화율(%)빈집 선제진단 건수(건)빈집 관리·대응 건수(건)확산 리스크공공·민간 데이터 공유·제공 수준 차이지역정책별 빈집 관리체계 및 기준 차이빈집 소유주 정보 확보·관리체계 차이카드 원문 전체 보기[서비스 개요]  기재 없음확산 리스크카드에 기재 없음카드 원문 전체 보기[서비스 개요]\n• 포항 파킹케어(ParkingCare)는 시 대표전화로 걸려오는 주차민원을 AI가 음성으로 24시간 접수하고, 누적된 콜 데이터를 단속 배치로 연결하는 AI 음성민원 창구(AICC) 서비스\n   - ① 접수 (24시간)\n   - ARS에서 주차민원 선택 시 AI가 주소, 차량번호, 위반유형을 음성으로 즉시 접수\n   - ② 처리 (담당부서)\n   - 위반유형, 행정구역별로 자동 분류해 담당 부서에 실시간 전달, 처리 결과 문자 자동 회신\n   - ③ 데이터 활용 (정책연계)\n   - 접수 위치, 시간, 위반유형 데이터를 누적 분석해 상습구역, 취약 시간대를 도출, 단속 배치에 반영(+ 확장) 소음, 쓰레기 무단투기, 도로 파손 등 생활민원 전 분야로 동일 플랫폼에서 채널 확장\n\n[서비스 배경]\n[반복되는 풍선효과 지적]\n   - 단속을 늘려도 차량이 인근 골목으로 옮겨갈 뿐 구조적 문제는 해결되지 않는다는 지적이 지역 언론에서 이어짐\n[감당 어려운 접수 창구]\n   - 전국 안전신문고 신고의 64.1%(월 43만 8,377건)가 불법주정차이나 주민신고는 1일 5회로 제한돼 국민권익위 시정권고를 받음\n   - 접수 횟수를 제한할 수밖에 없었던 것은 접수, 처리 역량의 한계였고 단속 인력과 장비만 늘리는 방식으로는 더 이상 해결되지 않음\n[갖춰진 인프라, 끊겨 있는 연결고리]\n   - 포항봇(생성형 AI 챗봇), 스마트시티 통합플랫폼(12억 원), CCTV 4,600여 대 등은 이미 보유하고 있으나 ‘음성(전화) 접수 채널과 콜 데이터→단속 배치 연계’ 두 가지가 비어 있음\n   - 민원 콜 데이터가 CCTV와 단속 인력 배치로 이어지지 않아 접수와 단속이 단절\n\n[주요 기능]\n[24시간 음성 접수 (상시)]\n   - 시 대표번호 전화 후 ARS에서 주차민원 선택 시 주차 전용 회선으로 즉시 분기\n   - AI가 주소, 차량번호, 위반유형을 음성으로 진술받아 자동 접수, 앱 설치와 회원가입 절차 없음\n   - 음성 인식 실패 시 상담 인력에게 즉시 연결\n[자동 분류, 처리]\n   - 위반유형, 행정구역별로 자동 분류해 남·북구 담당 부서로 실시간 전달\n   - 접수 확인 및 처리 결과를 문자로 자동 회신해 재문의 부담 해소\n[콜 데이터 기반 단속 배치]\n   - 접수 위치, 시간, 위반유형을 누적 분석해 상습 발생 구역과 취약 시간대를 자동 도출\n   - 고정식 CCTV와 이동식 단속 인력을 데이터가 지시하는 곳에 우선 배치, 주차면 확충 검토 기초자료로 활용\n\n[목표]\n• 전화 민원을 24시간 접수 채널로 전환하고 축적된 콜 데이터로 단속 배치의 정책적 근거를 마련하여 시민 불편과 행정 비효율을 함께 줄이는 것을 목표\n[시민 체감]\n   - 야간, 주말, 공휴일 포함 24시간 접수, 통화 대기 없이 동시 다중 응대\n[정책 정당성]\n   - 콜 데이터 기반 배치로 풍선효과 비판에 수치로 대응, 지역 간 형평성을 객관 지표로 담보\n[행정 효율]\n   - 정형 민원을 자동 처리하고 확보된 인력을 현장 확인과 정책 업무로 재배치\n\n[현재 수준]\n   - 2026년 8월 정책사업 제안 단계로 포항시 도입 전 시범사업 검토 중\n   - 포항시는 2026년 2월 정식 운영 중인 생성형 AI 챗봇 '포항봇'과 스마트시티 통합플랫폼(사업비 12억 원)을 기존 자산 위에 음성 채널을 확장하는 구조\n\n[적용 기술]\n• [생성형 AI 챗봇 음성 확장]◦기존 텍스트 기반 포항봇의 AI 자산을 전화 음성 채널로 확장\n[ARS 분기 + AI 음성 인식]\n   - 전화 인바운드 → ARS 메뉴 분기 → AI가 주소, 차량번호, 위반유형을 음성으로 인식 및 접수(실패 시 상담 인력 연결)\n[자동 분류, 라우팅 및 CCTV 연계]\n   - 위반유형, 행정구역별 자동 분류, CCTV 통합관제 영상과 교차 확인\n[콜 데이터 분석 및 배치 의사결정]\n   - 위치, 시간, 위반유형 누적 데이터로 상습구역과 취약시간대 도출, 고정식 CCTV·인력 우선배치에 활용\n\n[서비스 대상]\n   - 시 대표전화로 주차 불편, 불법주정차를 신고하려는 시민 전 연령(앱 설치 부담 없어 고령층 포함)\n   - 단속 인력, CCTV 배치를 결정하는 시 교통행정 또는 주차단속 담당 부서 담당자\n\n[적용 사례]\n   - 본 서비스는 포항시를 대상으로 한 신규 정책 제안으로 현재까지 자체 운영 실적은 없음\n   - AI 음성 접수와 콜 데이터 기반 단속 배치 연계를 결합한 방식은 포항이 최초로 제안하는 모델이며, 포항시와 협의를 거쳐 특정 구·시간대 한정 시범 적용을 통해 효과를 검증할 계획\n\n[데이터허브 연계 여부 및 참여 조건]\n   - 데이터허브 연계 가능 여부(☑체크): ☑ 가능 □ 불가(사유 )\n   - 참여 조건 : 개인정보보호법 등 관계 법령에 따른 데이터 처리 근거 및 기관 간 협약 마련\n   - 연계 범위: 개인식별정보를 제외한 민원 접수 현황, 처리 결과, 콜 데이터 기반 상습구역·배치 통계정보 등을 기관 간 협의에 따라 표준 API 방식으로 연계 가능\n   - 세부 연계항목, 제공주기, 보유기간 및 이용목적은 데이터 제공기관과 수요기관 간 협의를 통해 결정\n\n[입력 데이터]\n[민원 접수 정보]\n   - 접수 일시, 주소, 차량번호, 위반유형, 신고자 연락처(선택) 등\n[연계 인프라 데이터]\n   - CCTV 통합관제 영상(교차 확인용), 기존 단속 인력과 장비 배치 정보, 스마트시티 통합플랫폼 연계 정보\n[처리 이력]\n   - 담당부서 배정 결과, 현장 확인·조치 이력\n\n[출력 데이터]\n[접수, 처리 결과]\n   - 접수확인·처리결과 SMS 발송 이력, 담당부서별 처리 상태\n[콜 데이터 분석 결과]\n   - 위치·시간·위반유형별 누적 통계, 상습구역·취약시간대 분석 결과\n[운영 통계 데이터]\n   - 접수 건수, 처리율, 평균 처리시간 등 관리자 대시보드 집계","시설물 관리카드 번호 14스마트 그늘막 최적 위치 선정 서비스지표면 온도, 생활인구, 도로망 데이터를 분석해 스마트 그늘막 최적 입지를 도출하는 서비스서비스 대상기초지자체, 생활인구, 노인인구, 유아인구적용 사례인천광역시 스마트 그늘막 최적 위치 선정 서비스주요 기능지표면 온도·생활인구·유동인구 데이터 분석도로 유형·인도 폭 등 도로망 현황 분석노인·유아인구 등 지역별 속성정보 분석지도 기반 최적 입지 도출·시각화목표기후·인구·도로 특성 반영 그늘막 적정 배치로 국민 편의 개선 및 설치 인력 낭비 절감현재 수준광역 데이터허브를 통한 기초지자체 활용 가능 수준국립환경과학원·국토교통부·인천광역시 데이터 기관 간 연계 필요적용 기술데이터허브IoT태양광온도·바람 감지센서공간분석위치정보 분석지도 기반 시각화데이터허브 연계국립환경과학원 지표면 온도, 국토교통부 인구·도로, 인천시 유동인구 수집·통합온도·인구·도로망 분석, 법정동·도로·인도 공간정보 정합성 확보최적 입지 도출·시각화, 기후변화 대응·설치 인력 낭비 절감 활용입력 데이터지표면 온도법정동 인구 수유동인구표준링크인도정보출력 데이터지역별 지표면 온도정보노인인구 수유아인구 수유동인구정보도로 유형정보인도 폭 정보스마트 그늘막 최적 입지정보후보 KPI스마트 그늘막 최적 입지 도출 건수(개소)최적 입지 기반 스마트 그늘막 설치율(%)노인·유아인구 등 폭염 취약인구 서비스 범위율(%)스마트 그늘막 설치 인력 절감률(%)확산 리스크지역별 온도·인구 분포 차이에 따른 입지 선정기준 차이지자체별 유동인구 데이터 구축·제공 수준 차이인구·유동인구 데이터의 공간단위·갱신주기 차이카드 원문 전체 보기[서비스 개요]\n• 지표면 온도, 생활인구 및 도로망 데이터 현황 분석을 통한 스마트 그늘막 최적 입지 도출\n\n[주요 기능]\n• 지표면 온도·생활인구·유동인구 데이터 분석\n• 도로 유형·인도 폭 등 도로망 현황 분석\n• 노인·유아인구 등 지역별 속성정보 분석\n• 지도 기반 스마트 그늘막 최적 입지 도출·시각화\n\n[목표]\n• 지역별 기후·인구·도로 특성 라우드 SaaSAI 주차수요 예측AICC STT·TTS데이터허브 연계데이터허브 연계 가능(원문 체크 표시)참여 조건: 관계 법령상 데이터 처리 근거 및 기관 간 협약 마련범위: 개인식별정보 제외 정보를 협의에 따라 표준 API 연계입력 데이터주차면 위치 좌표주차장 유형·운영시간·요금차량번호·차량 위치입출차 시각·이용시간요금 정산정보주차면 점유 상태부정주차·단속 증거정보감면 대상 확인정보출력 데이터주차면 이용 가능·점유 정보입출차·이용시간·요금·결제 결과부정주차 의심 차량·증거자료주차장별 이용률·회전율·매출주차수요 예측·공급 권고정보후보 KPI카드에 기재 없음확산 리스크카드에 기재 없음카드 원문 전체 보기[서비스 개요]\n• 탄력주차는 위치정보와 차량정보를 매칭하여 물리적 주차면을 디지털 주차면으로 전환하고, 주차면별 고정형 하드웨어 설치 없이 입차, 출차, 결제, 예약, 공유, 현황관리 서비스를 제공하는 SaaS 기반 주차관리 플랫폼\n• 시민은 탄력주차 앱, QR 웹 또는 기존 지도, 모빌리티 앱을 통해 이용하고, 지자체와 운영기관은 관리자 웹을 통해 주차 현황과 운영 데이터를 통합 관리\n\n[서비스 배경]\n[도심 주차문제]\n• 도심 주차문제는 주차면의 절대적인 부족뿐만 아니라 시간대와 지역에 따른 주차 수요, 공급의 불균형에서 발생[그림 1. 제1차 국토교통 공공기관 데이터 협의체 설명자료 및 교통환승지역(대구공항) 주차 문제 뉴스 기사]\n[설치 및 운영 비효율]\n• 노상, 거주자우선주차장 등 기존 공영주차장은 관리원, 주차미터기, IoT 센서, 차단기 등의 설치, 운영 비용으로 인해 소규모 또는 분산된 주차면을 효율적으로 운영하기 어려움\n[그림 52 기존 주차장 관리(차단기, 카메라, 전산기, 주차관리원)]\n[유휴 주차공간의 낮은 활용성]\n• 거주자우선주차면, 도로 주변 유휴공간, 부설주차장 등 기존 공간이 특정 시간대에 사용되지 않더라도 시민이 빈자리 정보를 확인하거나 이용하기 어려움\n[주차 운영, 관리 데이터 분절]\n• 주차 서비스와 단속, 관리 데이터가 분리되어 있어 부정주차 확인, 요금 관리, 이용 현황 분석 및 정책 수립에 한계가 있음\n\n[주요 기능]\n[디지털 주차면 생성 및 이용 서비스]\n• 주차면 좌표와 차량번호를 매칭하여 물리적 주차면을 디지털 주차면으로 전환\n• 앱, QR 웹 및 기존 지도, 모빌리티 앱을 통한 주차면 검색, 입차, 출차, 결제, 예약 및 공유 서비스 제공\n• 이용 조건을 충족한 차량은 주차면 진입, 이탈을 감지하여 자동 입차, 출차 처리하고 등록된 결제수단으로 자동 결제\n[그림 53 탄력주차 주차면 디지털화 플로우]\n[통합 운영·관리 및 단속]\n• 관리자 웹을 통해 주차면별 이용 현황, 운영시간, 요금, 매출, 부정주차 및 단속 현황을 실시간 관리\n• 고정형 CCTV, 단속차량, 지역 배달라이더 등 다양한 단속수단과 연계하여 부정주차 차량을 확인하고 증거자료 수집\n[그림 54 단속방식: 기존 vs 탄력주차]\n[데이터 연계 및 수요예측]\n• 공공 주차정보시스템과 민간 지도, 모빌리티 플랫폼을 API로 연계하여 동일한 주차정보를 다양한 서비스에서 활용\n• 주차장 이용데이터, 모바일데이터, 대중교통데이터 등을 분석하여 시간, 장소별 주차 수요를 예측하고 필요한 주차면을 탄력적으로 공급\n[AI 기반 고객지원]\n• AICC 챗봇, 콜봇을 통해 앱 설치, 입차, 출차, 요금 및 이용방법 관련 민원에 24시간 대응\n\n[목표]\n• 기존 노상, 거주자우선, 노외, 부설주차장과 도로 주변 유휴공간을 디지털화하여 새로운 시설 설치를 최소화하면서 주차 공급 확대\n• 실시간 주차정보 제공으로 시민의 주차 탐색시간과 불법주정차를 줄이고 주차 이용 편의성 향상\n• 주차 서비스와 관리 데이터를 통합하여 지자체의 운영비용을 절감하고 데이터 기반 주차정책 수립 지원\n• 공공 주차정보를 민간 플랫폼과 연결하여 지역과 플랫폼에 관계없이 이용할 수 있는 개방형 주차 생태계 구축\n\n[현재 수준]\n• 상용운영 및 실증: 대구광역시 노상주차장 330면 상용 운영 중이며, 의정부시 국토교통부 혁신기술 실증사업 및 서울특별시 강남구 거주자우선주차장 시범사업 완료\n• AI 기능 고도화: AX-Sprint 지원사업을 통해 주차수요 예측, 주차면 탄력 공급, 거주자우선주차면 공유 예측, 동적 요금제 및 주차요금 자동감면 기능 고도화 추진 중\n• 지자체 적용 협의: 지자체 수요처로부터 서비스 적용을 위한 주차면 후보지를 제공받아, 대상지별 운영 여건을 검토하고 세부 운영계획 협의 중\n• 플랫폼 연계 및 확산: 한국교통안전공단, 지자체 주차정보시스템 및 민간 지도, 모빌리티 플랫폼과의 API 연계를 통한 서비스 확산 추진 중\n• 인증 확보: 혁신제품, 우수제품 지정 및 GS인증 1등급 등 공공기관 도입 관련 인증 보유\n[그림 55 탄력주차 혁신제품 및 우수제품 인증서]\n\n[적용 기술]\n[정밀 위치, 차량 인식 기술]\n• RTK, GNSS 위성 기반 위치보정 및 주차면 정밀 좌표 설정 기술\n• 가상정보 수신구역 지오펜싱과 차량번호, 주차면 위치 매칭 기술\n• 차량번호 자동인식 기반 실시간 주차정보 정합성 검증 및 부정주차 탐지 기술\n[자동 입, 출차 및 결제 기술]\n• 차량 이동정보 기반 자동 입차, 출차 및 등록카드 자동결제 기술\n[플랫폼 연계, 운영 및 AI 수요예측 기술]\n• 공공 주차정보시스템 및 민간 지도, 모빌리티 플랫폼 연계를 위한 Open API 기술\n• 클라우드 기반 SaaS 주차면 관리 및 실시간 운영 모니터링 기술\n• 주차, 모바일, 대중교통 데이터 기반 AI 주차수요 예측 및 주차면 공급 기술\n[AI 고객지원 기술]\n• AICC 기반 STT, TTS 챗봇, 콜봇 및 24시간 민원 응대 기술\n\n[서비스 대상]\n• 노상, 노외, 거주자우선, 부설주차장 및 유휴공간을 운영하는 지방자치단체와 공공기관\n• 공영, 민영주차장 운영사업자와 모빌리티 플랫폼 사업자\n• 주차장을 이용하는 일반 시민, 앱 비사용자 및 디지털 취약계층\n• 거주자, 공유차량, 소상공인 택배차량, 장애인 차량, 국가유공자 차량 등 주차정책 대상자\n\n[적용 사례]\n• 대구광역시 노상주차장 330면 상용 운영\n• 경기도 의정부시 국토교통부 혁신기술 실증사업 완료 및 상용화 추진\n• 서울특별시 강남구 거주자우선주차장 대상 시범사업 완료\n• 노상주차장, 거주자우선주차장, 도로 주변 유휴공간 등을 대상으로 디지털 주차면 전환 및 지도, 모빌리티 서비스 연계 실증\n\n[데이터허브 연계 여부 및 참여 조건]\n• 데이터허브 연계 가능 여부(☑체크): ☑ 가능 □ 불가(사유 )\n• 참여 조건 : 개인 정보보호법 등 관계 법령에 따른 데이터 처리 근거 및 기관 간 협약 마련\n• 연계 범위: 개인식별정보를 제외한 대상자 상태정보, 안부확인 결과, 연계 서비스별 생활데이터 변화정보 및 통계정보 등을 기관 간 협의에 따라 표준 API방식으로 연계 가능\n• 세부 연계항목, 제공주기, 보유기간 및 이용목적은 데이터 제공기관과 수요기관 간 협의를 통해 결정\n\n[입력 데이터]\n• 주차면 위치 좌표, 주차장 유형, 운영시간, 주차요금 및 이용 조건\n• 차량번호, 차량 위치, 입차, 출차 시각 및 주차 이용시간, 요금 정산정보\n• 주차면 점유 상태, 부정주차 차량정보 및 단속 증거정보\n• 장애인, 국가유공자, 친환경차 등 감면 및 주차복지 대상 확인정보\n\n[출력 데이터]\n• 주차면별 이용 가능 여부, 점유 상태 및 빈자리 정보\n• 차량별 입차, 출차 결과, 이용시간, 주차요금 및 결제 결과\n• 부정주차 의심 차량, 단속 대상 및 증거자료\n• 주차장별 이용률, 회전율, 매출 및 시간대별 이용 통계\n• 지역, 시간대별 주차수요 예측과 탄력적 주차면 공급 권고정보","환경·에너지·수자원카드 번호 09공공건물 도시에너지 관리 시스템공공건물 에너지 사용을 모니터링하고 도시 공공 에너지 데이터를 통합해 비용 절감과 쾌적한 실내 환경을 지원하는 서비스서비스 대상공공건물 운영자, 공공청사, 유관기관 건물적용 사례삼성서초사옥·GS강남타워 BEMS, LG그룹 상암 혼잡이 확산될 수 있음\n• 스마트교차로에서 수집 및 AI가 분석한 교통정보를 신호운영에 반영하여 변화하는 수요에 능동적으로 대응할 수 있는 지능형 교통신호 운영체계가 필요\n\n[주요 기능]\n• (AI 기반 교통정보 수집) 스마트교차로의 영상정보를 AI로 분석하여 교차로 접근로 및 회전별 차량을 검지하고 교통량과 대기행렬 정보를 수집\n• (AI 교통수요 산정) 각 회전별 녹색신호시간 동안 통과한 교통량과 신호 종료 후 통과하지 못한 대기행렬을 산정 및 예측하고, 이를 신호운영에 활용 가능한 교통수요로 가공\n• (신호 최적화 수행) 산정된 접근로 및 회전별 교통수요를 기반으로 센터 시스템에서 신호주기와 현시별 녹색시간 등 교차로 신호운영에 필요한 파라미터를 산출\n• (센터 기반 신호 제어) 센터에서 산출된 신호운영 파라미터를 현장 신호제어기에 명령으로 전달하고, 제어기는 해당 명령을 반영하여 신호를 운영\n• (LLM 활용 운영자 의사결정지원) 신호제어 결과, 교통상태, 센터시스템 운영정보 등을 LLM이 종합 분석 및 주요 변화와 이상상황을 설명\n\n[목표]\n• 교차로 통행 차량의 지체시간 15% 이상 감소\n• 교차로 및 주요 도로축의 혼잡을 완화하고 차량 통행 효율 향상\n• 변화하는 교통상황에 능동적으로 대응 가능한 지능형 신호운영체계 구현\n• 교통상황 및 신호운영 결과, 운영정보 등에 대한 분석·해석을 지원, 운영자의 상황판단 및 대응 효율 향상\n\n[현재 수준]\n• 지자체 대상 실제 구축 및 운영 단계의 상용화 기술\n• 스마트교차로, 센터 시스템 및 현장 신호제어기를 연계한 교통신호 제어체계 운영\n• 군포시, 안양시, 안성시, 군산시, 경주시, 울산시, 강릉시 등 다수 지자체에 시스템을 구축하여 실제 교통신호 운영에 활용 중\n\n[적용 기술]\n• (AI 영상분석 기반 차량 인식·추적 기술) 도로 영상에서 차량을 인식하고 차종, 교통량, 대기행렬 등 교통정보를 추출하는 기술\n• (교통수요 가공·분석 기술) 녹색신호동안 처리된 교통량과 대기행렬 등을 결합하여 접근로 및 회전별 교통수요를 산정하는 기술\n• (신호운영 파라미터 산정 기술) 교통수요정보를 통해 주기, 현시별 녹색시간 등 현장 적용이 가능한 신호제어 파라미터를 산출하는 기술\n• (LLM 기반 운영정보 분석 기술) 교통상태, 신호제어 결과 및 센터시스템 운영정보 등을 연계하여 주요 변화, 이상징후 및 운영상황을 분석·해석하는 기술\n• (LLM 기반 의사결정 지원 기술) 분석결과를 자연어로 요약하고 원인 및 대응방향을 제시하여 운영자의 교통운영 판단을 지원하는 기술\n\n[서비스 대상]\n• 지자체 및 경찰 등 교통신호 운영·관리 주체와 센터 운영자\n• 신호교차로와 주요 도로축을 이용하는 도로 이용자\n\n[적용 사례]\n• 군포시, 안양시, 안성시, 군산시, 경주시, 울산시, 강릉시 등 다양한 지자체 교통 신호운영 현장에 적용\n\n[데이터허브 연계 여부 및 참여 조건]\n• 데이터허브 연계 가능 여부: ☑ 가능 □ 불가(사유 )\n• 참여 조건 :\n   - 데이터 허브와 센터시스템 간 교통정보 송수신을 위한 연계 인터페이스 및 통신환경 확보 필요\n   - 영상 원본 등 개인 식별 가능성이 있는 데이터는 관련 법령 및 기관의 개인정보·보안정책에 따라 비식별 처리하거나 연계 대상에서 제외\n\n[입력 데이터]\n• 스마트교차로 영상 정보\n• 접근로 및 회전별 교통량 정보\n• 현장 신호제어기 운영상태 정보\n• 센터시스템 상태 및 장애·이벤트 정보\n\n[출력 데이터]\n• 교차로별 최적 신호주기 및 현시별 녹색시간 정보\n• 현장 신호제어기 적용상태 및 운영 결과 정보\n• 운영자 의사결정을 위한 자연어 요약 및 대응방향 정보","근로·고용카드 번호 30도시데이터 기반 오픈랩도시데이터 기반 신규 솔루션 개발·창업을 위해 학습용 데이터, 컨설팅, 클라우드 서버 등 컴퓨팅 자원을 제공하는 서비스서비스 대상플랫폼 서비스 제공자, 서비스 개발자(중소·벤처, 스타트업), 대학·연구소, 시민, 공무원적용 사례광역지자체 17개 \r\n관리자, 탄소중립 관련 부\r\n서, 탄소중립 지원센터 적 용 사 례 ž 추 정 비 용 ž 데이터허브 2.0 \r\n연계 가능성(신규)\r\nž (1단계) 환경센서 데이터, 공공건축물 에너지 사용량, 스마트시설 전력 소비량, 시민 \r\n행동 실천·포인트 정보, 재활용량, 교통량·혼잡도, 전기차 충전 전력 소비량 및 외부사\r\n업 온실가스 감축실적 수집·통합\r\nž (2단계) 자연어처리·딥러닝 기반 데이터 분석, 탄소 배출·감축 현황 통합분석 및 센서 \r\n데이터 형식 표준화·실시간 연계\r\nž (3단계) 탄소 배출·감축 통합 대시보드, 탄소 중립 지도, 시민 참여형 탄소저감 활동, 외부사업 실적관리 및 정책 대상지역 선정 활용\r\n입력데이터(신규)\r\nž 기온, 습도, 미세먼지, CO₂, 공공건축물 전력·가스·난방 사용량, 스마트시설 전력 소비\r\n량, 시민 행동 실천내역, 포인트 적립·지급정보, PET·캔 재활용량, 보상 지급이력, 교\r\n통수단별 교통량, 평균속도, 정체지수, 전기차 충전소 전력 소비량, 외부사업 온실가스 \r\n감축실적\r\n출력데이터(신규)\r\nž 부문별·시간대별·정책별·사업별 탄소 배출·감축 현황, 지역별 에너지 과소비 구역, 시민 \r\n행동 실천 우수 구역, 간접 탄소배출량 추정정보, 탄소저감 추정정보, 시민 참여도 분\r\n석정보, 정책 대상지역 우선순위\r\n후보 KPI(신규)\r\nž 탄소중립포인트 실천율(%)\r\nž 시민 탄소저감 활동 참여율(%)\r\nž 재활용률(%)\r\nž 외부사업 온실가스 감축 실적 등록 건수(건)\r\n확 산 리 스 크 ž 지자체별 센서 데이터 형식 및 실시간 연계 수준 차이에 따른 데이터 표준화 제약\r\nž 탄소중립포인트 플랫폼·교통정보센터·스마트 주차 관제 시스템·탄소중립 지원센터 간 \n□ 서비스 이미지\r\n1차 판정(신규)\r\n데이터 연계 및 운영 거버넌스 확보 필요\r\nž 공공건축물·스마트시설·교통·자원순환 등 부문별 데이터 수집 범위 차이에 따른 통합분\r\n석 제약","분류\r\n번호 5 안전플랫폼 및 재난재해 \r\n서비스 (한파폭염) 유형 방범·방재\r\n서 비 스 개 요 ž 재해재난(수재해, 경사지 붕괴, 폭염) 관련 센서 데이터를 실시간 수집·분석·공유· 전파하여 데이터 기반의 맞춤형 재해재난 대응 서비스를 제공하는 통합 안전플랫폼\r\n주 요 기 능\r\nž 경사지 붕괴 예·경보 서비스 (강우 데이터 및 기울기 센서 기반 5단계 위험도 평가) ž 도시홍수 상황인지 서비스 (실시간 기상관측 및 1·2차원 침수 예측 정보 제공) ž 폭염 저감 서비스 (상세 공간 단위 취약성 분석 및 Massive IoT 기반 저감장치 \r\n자동 제어) ž 위치 기반 재난 경보 전파 및 도시안전 모바일 앱 연동\r\n목 표 ž 분산된 재난 정보의 통합 공유 및 분석을 통한 시민 대피시간 확보 및 재해재난 \r\n피해 최소화\r\n현 재 수 준\r\nž 안전플랫폼, 경사지 붕괴 예·경보, 도시홍수 상황인지, 폭염 저감 서비스 및 모바일 앱 기술 \r\n실증 및 성과 검증 완료 단계\r\nž 경사지 붕괴 발생 시각의 정확한 예측 한계 및 야생동물·등산객에 의한 센서 노이즈 발생\r\nž 도시유출모형 검·보정을 위한 우수관로 수위 관측망 추가 확보의 비용 및 유지관리 측면 한계\r\nž 폭염 취약성 분석 및 저감장치 배치 최적화의 실시간 자동화 시스템 미구축\r\n적 용 기 술 ž Massive IoT, REST API, JSON, 2DIS 모형(2차원 도시유출모형), CFD(전산유체역학), \r\n나노미스트, AWS, ASOS, 이동평균법, 온도보정\r\n서 비 스 대 상 ž 재난상황실, 구호부서, 관\r\n제센터, 일반 시민 적 용 사 례 ž 대구광역시(북구 연암공원, 서구 \r\n비산동 및 인동촌 일대) 추 정 비 용 ž 데이터허브 2.0 \r\n연계 가능성(신규)\r\nž (1단계) 경사지 센서 데이터, 수위계 데이터, 환경 센서 데이터(온도, 습도, 미세먼지, 풍\r\n향, 풍속), 기상청 강우 관측/레이더 데이터, 사용자 GPS 위치 데이터 수집·통합\r\nž (2단계) 경사지 붕괴 알고리즘(이동평균·온도보정 적용), 1·2차원 침수 예측 해석 모형, CFD 기반 폭염 취약성 분석 및 데이터 정합성 확보\r\nž (3단계) 안전플랫폼 대시보드 표출, 위치 기반 도시안전 모바일 앱 경보 전파, 폭염저감\r\n장치 자동 제어 및 지자체 재난 대응 의사결정 지원 활용\r\n입력데이터( 신 규 ) ž 경사지 기울기(x, y축), 경사지 온도, 수위계 관측 수위, 환경 온도, 습도, 미세먼지, 풍향, 풍속, 기상청 강우 정보, 현장 지반 물성치, 사용자 GPS 위치 정보\r\n출력데이터( 신 규 ) ž 경사지 붕괴 위험도 단계, 수심, 월류량, 침수심, 침수면적, 홍수 예·경보, 폭염 취약성 등\r\n급 지도, 폭염저감장치 제어 신호, 위치 기반 재난 경보 메시지\r\n후 보 K P I ( 신 규 )\r\nž 수재해 발생 시 시민 대피시간(분) ž 폭염저감장치 온도저감률(%) ž 서비스 만족도(점) ž 경사지 붕괴 검증 정확도(%)\r\n확 산 리 스 크 \r\n1 차 판 정 ( 신 규 )\r\nž 경사지 센서 전원 유선화 시 한전, 지자체, 사유지 토지소유주 간 협의 및 법·제도적 권한 \r\n조정 제약\r\nž 지자체별 우수관로 수위 관측망 및 기상관측장비 등 방재 기초 인프라 구축 수준 및 데이터 \r\n표준화 차이\r\nž 폭염저감장치(나노미스트) 도입 시 조경 분야 수경시설 관련 국가 설계기준 미비 및 수질·상\r\n수도/전력 공급 연계 행정 절차적 한계\n□ 서비스 이미지","분류\r\n번호 6 지능형 CCTV 선별 관제 시스템 유형 방범·방재\r\n서 비 스 개 요 ž CCTV 영상 분석으로 사물·사람과 사고·재난 등 대상을 식별하여 인식함으로써 관제 \r\n기능을 직·간접적으로 지원하고 모니터링 효율성을 극대화하는 서비스\r\n주 요 기 능\r\nž 공간, 사물, 사람 식별 및 실시간 모니터링·이벤트 자동 탐지(배회, 침입, 유기, 싸움, 방화, 쓰러짐 등) ž 다중 CCTV 영상 속 사람과 차량 식별 및 이동 경로 추적\r\nž 개인정보 비식별화(얼굴, 번호판) 및 영상 반출 통제(암호화, 전용 플레이어) ž 딥러닝 기반 고속 검색 및 지능형 연기·화재 분석\r\n목 표 ž 인공지능 기반 CCTV 영상 분석 및 이상 상황 자동 탐지를 통한 대응 시간 최소화 및 \r\n시민의 재산과 인명 보호\r\n현 재 수 준\r\nž AI 기반 객체 탐지, 이벤트/행동 패턴 인식, 객체 추적, 개인정보 비식별화 기술 상용화 및 \r\n도입 단계\r\nž 서울시, 인천시, 경기도 오산시, 베트남 하이퐁시 등 국내외 지자체 중심 보급 확대 및 \r\n지능형 CCTV 단계적 전환 추진\r\nž 증가하는 CCTV 수 대비 관제 인력 증원 한계, 육안 관제 시 CCTV 영상 순환 사이에 \r\n발생하는 사건·사고 탐지 대응 지연, 관제 인력 변경 시 경험 차이에 따른 대응 지연 우려\r\n적 용 기 술 ž AI, 딥러닝, KISA-KCTC 인증 AI 알고리즘, Re-ID(재인식) 기술, 영상 암호화 기술\r\n서 비 스 대 상\r\nž CCTV 관제센터, 관제 요원, 지자체, 유관기관(경찰, 소방 \r\n등) 적 용 사 례\r\nž 서울시(CCTV 지능형 전환), \r\n인천광역시(지능형 CCTV \r\n보급), 경기도 오산시(지능형 \r\n선별 관제 시스템 도입), \r\n베트남 하이퐁시 안즈엉현 추 정 비 용 ž 데이터허브 2.0 \r\n연계 가능성(신규)\r\nž (1단계) CCTV 실시간 영상, 사물·사람·차량 객체 데이터, 불꽃·연기 및 산불 관련 데이터 \r\n수집·통합\r\nž (2단계) 딥러닝 기반 객체 탐지 및 차종/색상 분류, 행위/이벤트 분석, Re-ID 기반 궤적 \r\n추적 및 데이터 정합성 확보\r\nž (3단계) 지능형 방범 스마트관제, 긴급상황 즉각 통보, 유관기관 연계, 신속한 화재·재난 \r\n대응 서비스 활용\r\n입력데이터( 신 규 ) ž CCTV 실시간 영상, 저장 동영상, 불꽃·연기 상황 정보, 산불 데이터\r\n출력데이터( 신 규 ) ž 객체 감지·추적 정보(차종, 색상 등), 이벤트 자동 탐지 알림(배회, 침입, 유기, 싸움, 방화, 쓰러짐 등), 이동 경로 추적 데이터, 비식별화 영상, 시간대별 통계 및 프로파일링 정보\r\n후 보 K P I ( 신 규 )\r\nž 대응 시간 단축률(%) ž 관제 인력 1인당 관제 CCTV 수(대) ž 알고리즘 정확성(%) ž 고속 검색 처리 속도(초)\r\n확 산 리 스 크 \r\n1 차 판 정 ( 신 규 )\r\nž 개인정보보호 관련 법·제도에 따른 영상 비식별화 및 영상 반출 통제(암호화, 전용 플레이어 사용) \r\n준수 제약\r\nž 지자체 및 유관기관 간 긴급상황 정보 연계 및 데이터 공유 거버넌스 차이\r\nž 지자체별 기존 CCTV 인프라 환경 및 지능형 전환 정책 추진 속도 차이\n□ 서비스 이미지","관리\r\n번호 7 AI·디지털트윈 SOC 시설관리 유형 시설물 관리\r\n구분 내용\r\n서비스 개요\r\n∙ AI·데이터기반 디지털트윈 SOC 시설관리 서비스\r\n- AI와 데이터를 기반으로 도시 SOC 시설물 관리를 지원하는 서비스 \r\n= 데이터를 기반으로 디지털트윈화하여 AI기술을 결합하여 효율적인 시설물 관리 지원\r\n서비스 배경\r\n(도시문제 등)\r\n∙ 도시 노후화 및 인구 감소에 따라 도시기반시설 SOC관리 효율화 요구 \r\n- 노후 관리대상 SOC 시설 지속 증가\r\n- 인구 감소 및 노후 관리 대상 SOC 증가에 따른 1인당 관리 SOC 증가 지속\r\n- AI 및 데이터를 기반한 효율화된 행정관리 기능으로 대처 필요\r\n주요 기능\r\n∙ 스마트시티 데이터허브 및 AI 도시 데이터 연결이 가능한 국제 표준 방식의 3D 데이\r\n터 구축 및 활용 체계\r\n∙ 데이터 기반 관리 이력 및 AI 분석 기반 예지 기능 구현\r\n∙ 공공관리영역 중 교량, 경사면, 노후건축물 등에 대해 디지털트윈 국토 정보를 기반\r\n으로 OGC 국제 표준 데이터로 데이터 관리 모델을 고도화하고 SOC 시설 관리 활용\r\n∙ 스마트시티 통합 플랫폼 체계와 연계하여 AI 도시 경보시스템과 효율화 된 연계\r\n목 표\r\n∙ 디지털트윈 국토 서비스와 연계하여 공공 SOC 시설물 관리 효율화\r\n∙ 빅데이터 및 AI 기술을 기반으로 건설 엔지니이어와 동급의 AI 진단 서비스 제공\r\n∙ 공공 SOC 시설물 관리 이력에 대해 디지털트윈 체계로 제공하여 보다 발전된 SOC \r\n관리 서비스 제공\r\n현재 수준\r\n∙ 일부 선도 지자체 자체 디지털트윈 공공 SOC 서비스 운영(서울시, 세종시 등)\r\n∙ 스마트시티 데이터허브 및 AI 도시 데이터 연계를 위한 데이터 규격 체계와 연동되\r\n지 않으며, 독립적인 시스템 구조로 운영 중\r\n∙ 온프래미스형 서비스로 타 지자체에 이식이 어려우며 데이터 분석 및 활용에 대한 \r\nSaaS 형 서비스를 제공하지 못함\r\n적용 기술\r\n∙ 영상 및 센서 기반 데이터 표준화 기술\r\n∙ 비표준 데이터의 OGC 데이터 표준 변환\r\n∙ 국제 표준 OGC 데이터 기반 경량화된 3D 시각화 및 서비스 플랫폼 체계\r\n∙ 공공 SOC 서비스로 연계할 수 있는 행정자동화 연계(행안부 NDMS 연계 등)\r\n서비스 대상\r\n∙ 노후화된 SOC 관리 수요가 증가하는 지방자치단체 공무원\r\n∙ SOC 관리 행정 비용의 최적화를 요구하는 지방자치단체 \r\n∙ SOC 관리업무를 대행하는 지역 업체\r\n추정 비용\r\n적용 사례\r\n∙ 서울시 디지털 트윈 교량관리 시스템(2024)\r\n∙ 완주군 디지털 트윈 경사면 안전관리 시스템(2025)\r\n∙ 한국 도로공사 서해안 고속도로 교량유지관리(2025)\r\n입력데이터\r\n∙ 드론, 로봇 촬영 데이터(영상, LiDAR)\r\n∙ IoT 센서 데이터\r\n∙ 3D Point Cloud 데이터\r\n∙ 고정밀 DEM\n구분 내용\r\n출력데이터\r\n∙ 복합 정보기반 3D 시각화 데이터\r\n∙ 다충 정보표출이 가능한 3D 시각화 데이터 및 가공 14 스마트 그늘막\r\n최적 위치 선정 서비스\r\n유형 시설물 관리\r\n서 비 스 개 요 ž 지표면 온도, 생활인구 및 도로망 데이터 현황 분석을 통한 스마트 그늘막 최적 입지 \r\n도출\r\n주 요 기 능\r\nž 지표면 온도·생활인구·유동인구 데이터 분석\r\nž 도로 유형·인도 폭 등 도로망 현황 분석\r\nž 노인·유아인구 등 지역별 속성정보 분석\r\nž 지도 기반 스마트 그늘막 최적 입지 도출·시각화\r\n목 표 ž 지역별 기후·인구·도로 특성을 반영한 스마트 그늘막 적정 배치를 통한 국민 편의 개선 및 \r\n설치 인력 낭비 절감\r\n현 재 수 준\r\nž 광역 데이터허브를 통한 기초지자체 활용 가능 수준\r\nž 국립환경과학원·국토교통부·인천광역시가 보유한 지표면 온도·인구·유동인구·도로·인도 \r\n데이터의 기관 간 연계 필요\r\n적 용 기 술 ž 데이터허브, IoT, 태양광, 온도·바람 감지센서, 공간분석, 위치정보 분석, 지도 기반 시각화\r\n서 비 스 대 상 ž 기초지자체, 생활인구, 노인인구, 유아인구 적 용 사 례 ž 인천광역시 스마트 그늘막 \r\n최적 위치 선정 서비스\r\n추 정 비 용 ž 데이터허브 2.0 \r\n연계 가능성(신규)\r\nž (1단계) 국립환경과학원 지표면 온도, 국토교통부 법정동 인구·표준링크·인도 및 인천광역시 \r\n유동인구 데이터 수집·통합\r\nž (2단계) 지표면 온도·생활인구·유동인구·도로망 현황 분석 및 법정동·도로·인도 공간정보 간 \r\n정합성 확보\r\nž (3단계) 스마트 그늘막 최적 입지 도출·시각화, 기후변화 신속 대응, 국민 편의 개선 및 \r\n설치 인력 낭비 절감 활용\r\n입력데이터( 신 규 ) ž 지표면 온도, 법정동 인구 수, 유동인구, 표준링크, 인도정보\r\n출력데이터( 신 규 ) ž 지역별 지표면 온도정보, 노인인구 수, 유아인구 수, 유동인구정보, 도로 유형정보, 인도 폭 정보, 스마트 그늘막 최적 입지정보\r\n후 보 K P I ( 신 규 )\r\nž 스마트 그늘막 최적 입지 도출 건수(개소) ž 최적 입지 기반 스마트 그늘막 설치율(%) ž 노인·유아인구 등 폭염 취약인구 서비스 범위율(%) ž 스마트 그늘막 설치 인력 절감률(%)\r\n확 산 리 스 크 \r\n1 차 판 정 ( 신 규 )\r\nž 지역별 지표면 온도·생활인구·유동인구 분포 차이에 따른 최적 입지 선정기준 차이\r\nž 지자체별 유동인구 데이터 구축·제공 수준 차이\r\nž 법정동 인구와 유동인구 데이터의 공간단위·갱신주기 차이\r\nž 지자체별 도로 유형·인도 폭 등 도로망 공간정보 구축기준 차이\r\nž 국립환경과학원·국토교통부·지자체 간 데이터 제공 및 연계체계 차이\n□ 서비스 이미지","분류\r\n번호 15 교통약자 보호구역 가변 \r\n운행속도 적용 의사결정\r\n유형 교통\r\n서 비 스 개 요\r\nž 교통약자 보호구역 도로 대상 시간대별 통행량, 차량 통행속도, 유동인구, 사고 데이터 \r\n등을 수집·분석하여 의사결정자에게 가변 차량속도 운영시간 및 운영구간 등 인사이트를 \r\n제시하는 서비스\r\n주 요 기 능\r\nž 교통약자 보호구역 내 시간대별 차량 통행량 및 통행속도 정보 처리\r\nž 교통약자 보호구역 내 시간대별 평균 인구이동량 정보 처리\r\nž 차량 차종별·인구 특성별 통행량 그룹화 및 시계열 기반 통계 분석\r\nž 보호구역 위치·시설물(CCTV, 과속방지턱, 펜스, 어린이 승하차구역) 오버랩 매쉬업 및 \r\n시설물 통계 분석\r\nž 어린이보호구역 생활안전지도 및 통행속도 결정지원 화면·보고서 제공\r\nž 교통약자 보호구역 내 가변속도 운영구역 안내\r\n목 표 ž 교통약자 보호구역 가변 차량 운행속도 적용 대상지 및 운영시간 선정에 대한 의사결정 \r\n지원\r\n현 재 수 준\r\nž 제주특별자치도 구축·운영 및 2023년 경상남도 확대 적용, 광역 데이터허브를 통한 기\r\n초지자체 활용 가능 수준\r\nž 어린이보호구역 중심 서비스 구현 및 노인·장애인보호구역 기초데이터 처리 수준에 한정\r\  \r\n연계 가능성(신규)\r\nž (1단계) 자율주행 순찰로봇의 실시간 순찰 영상, 열화상·실화상 온도 데이터, 가스 센서 측\r\n정 데이터, 이상소음 데이터, RTK 기반 정밀 위치 데이터 수집·통합\r\nž (2단계) AI 기반 동적 객체(보행자, 차량, 자전거 등) 인식·식별, 고온 물체 과열 진단, 위\r\n험요소 감지 및 데이터 정합성 확보\r\nž (3단계) 관제센터 연계 실시간 위험 상황 모니터링, 현장 경고 방송/계도 메시지 송출, 경\r\n찰·경비요원 공조 구난 지원 및 화재·재난 예방 서비스 활용\r\n입력데이터( 신 규 ) ž 순찰지역 실시간 영상, 열화상/실화상 이미지, 온도 데이터, 흡입 가스 데이터, 이상\r\n소음 데이터, RTK 위치 정보, 3D LiDAR/센서 데이터\r\n출력데이터( 신 규 ) ž 위험상황/이벤트 감지 알림, 과열 진단 정보, 객체 식별 정보, 경고 방송/계도 메시지 음\r\n성, 관제센터 송신 영상, 순찰 상태 정보\r\n후 보 K P I ( 신 규 )\r\nž 위치 보정 정확도(cm) ž 이상상황 감지 정확도(%) ž 순찰 지역 사각지대 해소율(%) ž 위험상황 관제센터 통보 시간(초)\r\n확 산 리 스 크 \r\n1 차 판 정 ( 신 규 )\r\nž 로봇의 보도 및 공공장소 운행, 영상 수집에 따른 개인정보보호 및 도로통행 관련 법·제도적 \r\n규제 제약\r\nž 지자체 관제센터, 경찰, 민간 경비업체 간 실시간 상황 공유 및 공동 대응 체계 구축에 대한 \r\n운영 거버넌스 차이\r\nž 계단, 경사로, 비포장도로 등 지리적·지형적 환경 특성에 따른 로봇 이동성 제약\n□ 서비스 이미지","분류\r\n번호 26 스마트 공동주택 통합관리 유형 주거\r\n서 비 스 개 요\r\nž 세대 내 실시간 전력 사용량 확인부터 방문 차량 등록, 전자 투표 등 공동주택 운영· 관리 포함 입주민 생활 지원 서비스 제공\r\nž 가정 내 편의성·보안성 개선 및 에너지 사용 등 관리 효율 향상 서비스 제공\r\n주 요 기 능\r\nž 전기·수도·가스 월별 사용량 비교, 세부 항목 조회, 관리비 내역 확인 및 납부 기능 제공\r\nž 방문차량 등록, 원패스 공동현관문 자동 출입 및 엘리베이터 호출 등 출입보안 연동\r\nž 스마트 가전(조명, 냉·난방, 무인택배 등) 및 홈 오토메이션(가스, 환기 등) 원격 제어\r\n목 표 ž 공동주택 분산 채널 통합 및 관리 업무 디지털화를 통한 관리비 투명성·효율성 확보 \r\n및 입주민 생활 편의 증진\r\n현 재 수 준\r\nž 민간 개발 스마트 공동주택 통합 관리 앱 연계를 통한 전국 단지 대상 서비스 제공\r\nž IoT 원격검침 단말기 및 디지털 수도 미터를 활용한 실시간 검침 및 누수 진단 서비\r\n스 운영\r\n적 용 기 술 ž 스마트 원격 검침 기술, 주차관제 시스템, 원 패스 보안 시스템, 스마트 워크 시스템, IoT 원격검침 단말기, 디지털 수도 미터\r\n서 비 스 대 상 ž 공동주택 입주민, 소규모 \r\n공동주택, 관리사무소 적 용 사 례\r\nž 부산 국가시범도시 스마트 빌리\r\n지(SmartThings 앱 연계), 아\r\n파트너(전국 1,600개 단지 145\r\n만 세대 이용) 추 정 비 용 ž 데이터허브 2.0 \r\n연계 가능성(신규)\r\nž (1단계) 디지털 계량기 기반 전력·수도·가스 실시간 사용량, 출입·주차 데이터, 스마트 \r\n가전/홈오토메이션 작동 정보 수집 및 통합\r\nž (2단계) 원격검침 상수도 검침 데이터를 활용한 비정상 사용량 분석, 옥내 누수·누전 \r\n비상상황 진단 및 데이터 정합성 확보\r\nž (3단계) 수도요금 청구 및 지자체 행정서비스 연동, 입주민 맞춤형 알림 및 공동주택 \r\n통합 관리 서비스 활용\r\n입력데이터(신규)\r\nž 전력 사용량, 수도 사용량, 가스 사용량, 방문차량 정보, 입주민 출입 정보, 커뮤니티 \r\n예약 데이터, 전자투표 데이터, 가전·홈오토메이션 제어 신호, 공문서·입주민 명부 데\r\n이터, 디지털 계량기 검침 데이터\r\n출력데이터(신규)\r\nž 월별/세부 관리비 내역 및 모바일 고지서, 실시간 사용량 비교 정보, 누전/누수 비상\r\n상황 경고 알림, 방문차량 출입 허가 신호, 공동현관 자동 열림 및 엘리베이터 호출 \r\n신호, 커뮤니티 예약 확정 정보, 전자결재 결과, 옥내 누수 알림\r\n후보 KPI(신규)\r\nž 모바일 통합 서비스 이용률(%)\r\nž 관리사무소 업무 디지털화율(%)\r\nž 원격검침 기반 누수·누전 감지 및 알림 정확도(%)\r\nž 공동주택 서비스 입주민 만족도 및 민원 감소율(%)\r\n확 산 리 스 크 \r\n1차 판정(신 규 )\r\nž 주차 등록, 모바일 고지서, 커뮤니티 등 서비스 채널 분산에 따른 통합ž연계 한계\r\nž IoT 기기 인프라 구축이 필요하며 기존 설비와의 연계 및 초기 구축비 부담이 존재\n□ 서비스 이미지","분류\r\n번호 27 스마트물관리 유형 환경·에너지· 수자원\r\n서 비 스 개 요 ž 실시간 수질·수량 관리시스템 SWM을 적용하여 소비자가 믿고 마실 수 있는 건강한 물 \r\n공급체계가 적용된 ‘정수기가 없는 도시’ 실현\r\n주 요 기 능\r\nž 취수원부터 수도꼭지까지 수질·수량 실시간 모니터링 및 원격 감시·제어\r\nž 블록시스템 기반 수량·수압·수질관리 및 비상연계\r\nž 스마트미터 기반 사용량정보 제공·누수 알림·돌봄대상자 활동감지\r\nž Water-NET 기반 수량·수질·위기관리 및 소비자 수질정보 제공\r\n목 표 ž 소비자가 믿고 마실 수 있는 건강한 물 공급체계 적용 및 ‘정수기가 없는 도시’ 실현\r\n현 재 수 준 ž 국내외 실증사례와 기술수준을 기반으로 한 기술구현 가능 단계\r\nž 파주 SWC 시범운영 완료, 세종 SWC 시범운영 등 지역 단위 적용 수준\r\n적 용 기 술 ž ICT, SWM, 블록시스템, 스마트미터링, 수질계측기, 누수감지센서, 수질전광판, Water-NET, 관파손 예방시스템, CCTV, 정보제공 앱\r\n서 비 스 대 상 ž 국가시범도시 입주민 및 \r\n이용객\r\n적 용 사 례 ž 파주 SWC 시범사업, 세종 \r\nSWC 시범사업\r\n추 정 비 용 ž 데이터허브 2.0 \r\n연계 가능성(신규)\r\nž (1단계) 취수원부터 수도꼭지까지 수질·수량, 유량·수압, 잔류염소, 가정별 사용량, 누수\r\n감지, 관파손 및 저수조 운영정보 수집·통합\r\nž (2단계) AI·빅데이터 기반 수질·수량, 누수·관파손 및 위기정보 분석과 데이터 표준화·품질관리 \r\n기반 정합성 확보\r\nž (3단계) 실시간 원격 감시·제어, Water-NET 기반 수량·수질·위기관리, 소비자 수질정보 \r\n제공, 누수 알림 및 돌봄대상자 활동감지 서비스 활용\r\n입력데이터(신규)\r\nž 수질정보, 수량정보, 유량, 수압, 잔류염소 농도, 가정별 물 사용량, 누수감지정보, 관파손정보, 저수조 수질정보, CCTV 정보\r\n출력데이터(신규)\r\nž 실시간 수질·수량 현황, 상시 사용량정보, 누수 알림, 돌봄대상자 활동감지정보, 관파손 \r\n예방정보, 위기관리정보, 소비자 수질정보\r\n후보 KPI(신규)\r\nž 급수구역 간 잔류염소 농도 차이 감소율(%)\r\nž 누수감시센서 누수 탐지율(%)\r\nž 스마트미터 사용량정보 정상 수집률(%)\r\n확 산 리 스 크 \r\n1차 판정(신규)\r\nž 가정마다 스마트미터기 설치를 해야하기에 그에 따른 확산 리스크 존재\r\nž 사업시행자 도로 등 공공시설에 반영된 것으로 국비 지원이 원칙적으로 불가\n□ 서비스 이미지","분류\r\n번호 28 AI 이동약자 지원 \r\n수요응답형 교통(DRT) 유형 교통\r\n서 비 스 개 요 ž 대중교통 운행 구간과 배차 간격을 사전에 정하지 않고 이용자의 이동 구간·이용 시간 \r\n등 실시간 요구를 반영한 대중교통 운행 관리 서비스\r\n주 요 기 능\r\nž 스마트폰 앱 기반 출발지·목적지 선택 및 차량 호출\r\nž 실시간 경로 생성 및 차량 배정, 유사 경로 내 합승 운행\r\nž 신용카드 자동결제 및 교통카드 접촉 결제, 콜전화 예약 접수\r\nž 승무원 앱 기반 최적경로 및 승·하차 지점 안내\r\nž 대중교통 환승 시스템, 버스정보시스템(BIS) 등 기존 대중교통시스템 연계\r\n목 표 ž 정규 대중교통 미운행 지역 주민의 이동 편의 제공 및 대기·이동 시간 단축을 통한 교\r\n통 접근성 향상\r\n현 재 수 준\r\nž 스마트시티 챌린지 사업 및 규제샌드박스 기반 실증·시범운영 단계\r\nž 인천·세종·과천·청주 등 대중교통 부족지역 중심 운영\r\nž 경기 6개 지자체·서울시 연결 광역형 DRT 시범사업으로 확대\r\n적 용 기 술 ž AI 기반 배차 알고리즘, 실시간 경로 생성 기술, 빅데이터 분석, DRT 플랫폼 관제시\r\n스템, 이용자·승무원 애플리케이션, 통합 단말기, QR 인증, BIS 연계\r\n서 비 스 대 상\r\nž 대중교통 취약지역 주민, 교통약자(어린이, 어르신, 휠체어 이용자), 시민, 승\r\n무원, 지자체\r\n적 용 사 례\r\nž 인천시 아이모드(I-MOD, \r\n영종도·송도·검단신도시), 세\r\n종시 셔클, 과천 콜버스(문\r\n원동·갈현동), 청주 콜버스\r\n(오송읍), 광역 콜버스(경기 \r\n수원·용인·화성·시흥·파주·광\r\n주 6개 지자체–서울시) 추 정 비 용 ž 데이터허브 2.0 \r\n연계 가능성(신규)\r\nž (1단계) 차량 위치·상태·운행 상태정보, 배차 요청, 이용자 호출·예약·결제 데이터, 노\r\n선·정류장 데이터 수집·통합\r\nž (2단계) AI 기반 배차 알고리즘 및 이용 패턴·경로·주행 빅데이터 분석을 통한 수요 \r\n예측 및 데이터 정합성 확보\r\nž (3단계) DRT 관제 및 최적 경로 생성, 대중교통 환승·BIS 연계 서비스, 교통약자 맞\r\n춤형 이동지원 서비스 활용\r\n입력데이터(신규)\r\nž 출발지·목적지 정보, 차량 호출·예약 정보, 차량 실시간 위치/상태/운행 상태정보, 배차 \r\n요청 정보, 노선·정류장 정보, QR 탑승확인 정보, 결제 정보\r\n출력데이터(신규)\r\nž 실시간 생성 경로, 배차 결과, 승·하차 지점 정보, 차량·운행 현황정보, 통계정보, 이용 \r\n패턴·경로·주행 분석 결과, 결제 내역\r\n후보 KPI(신규)\r\nž 평균 대기시간 절감률(%)\r\nž 이동시간 절감률(%)\r\nž 자가용 이용량 감소(회)\r\n확 산 리 스 크 \r\n1차 판정(신규)\r\nž 규제샌드박스 실증 기반 운영 서비스로 확산 지역의 여객운송 관련 법·제도적 제약\r\nž 시·도 간 광역형 운행에 따른 지자체 간 운영 거버넌스 및 요금·환승 체계 협의 필요\r\nž 지역별 대중교통 환승 시스템·버스정보시스템(BIS) 구축 및 연계 수준 차이\r\nž 지방 중소도시의 노선 여건 및 정류장 인프라 등 지리적·운영 여건 차이\n□ 서비스 이미지","관리\r\n번호 29 AI 스마트교차로 기반 실시간신호제어 서비스 유형 교통\r\n구분 내용\r\n서비스 개요\r\n∙ 스마트교차로에서 AI 영상분석을 통해 교통정보를 수집하고, 센터시스템에서 교통수요 및 \r\n신호운영 파라미터를 산출하여 현장 신호제어기에 적용하는 지능형 교통신호 제어 서비스\r\n∙ 교통수요 변화에 대응한 신호운영을 통해 차량 지체와 혼잡을 완화하고, LLM을 활용한 \r\n운영결과 및 시스템 상태 분석을 통해 교통센터 운영자의 의사결정을 지원하는 서비스\r\n서비스 배경\r\n(도시문제 등)\r\n∙ 기존 교통신호는 과거의 교통량을 바탕으로 사전에 설정한 시간대별 신호계획에 따\r\n라 운영되어 교통수요의 급격한 변화에 대해 유연하게 대응하기 어려움\r\n∙ 실제 교통수요와 신호운영이 일치하지 않을 경우 불필요한 차량 대기와 지체가 발생하\r\n고, 대기행렬 증가로 주변 도로까지 혼잡이 확산될 수 있음\r\n∙ 스마트교차로에서 수집 및 AI가 분석한 교통정보를 신호운영에 반영하여 변화하는 수요\r\n에 능동적으로 대응할 수 있는 지능형 교통신호 운영체계가 필요\r\n주요 기능\r\n∙ (AI 기반 교통정보 수집) 스마트교차로의 영상정보를 AI로 분석하여 교차로 접근로 \r\n및 회전별 차량을 검지하고 교통량과 대기행렬 정보를 수집\r\n∙ (AI 교통수요 산정) 각 회전별 녹색신호시간 동안 통과한 교통량과 신호 종료 후 통과하\r\n지 못한 대기행렬을 산정 및 예측하고, 이를 신호운영에 활용 가능한 교통수요로 가공\r\n∙ (신호 최적화 수행) 산정된 접근로 및 회전별 교통수요를 기반으로 센터 시스템에서 \r\n신호주기와 현시별 녹색시간 등 교차로 신호운영에 필요한 파라미터를 산출\r\n∙ (센터 기반 신호 제어) 센터에서 산출된 신호운영 파라미터를 현장 신호제어기에 명령으\r\n로 전달하고, 제어기는 해당 명령을 반영하여 신호를 운영\r\n∙ (LLM 활용 운영자 의사결정지원) 신호제어 결과, 교통상태, 센터시스템 운영정보 등\r\n을 LLM이 종합 분석 및 주요 변화와 이상상황을 설명\r\n목 표\r\n∙ 교차로 통행 차량의 지체시간 15% 이상 감소\r\n∙ 교차로 및 주요 도로축의 혼잡을 완화하고 차량 통행 효율 향상\r\n∙ 변화하는 교통상황에 능동적으로 대응 가능한 지능형 신호운영체계 구현\r\n∙ 교통상황 및 신호운영 결과, 운영정보 등에 대한 분석·해석을 지원, 운영자의 상황판\r\n단 및 대응 효율 향상\r\n현재 수준\r\n∙ 지자체 대상 실제 구축 및 운영 단계의 상용화 기술\r\n∙ 스마트교차로, 센터 시스템 및 현장 신호제어기를 연계한 교통신호 제어체계 운영\r\n∙ 군포시, 안양시, 안성시, 군산시, 경주시, 울산시, 강릉시 등 다수 지자체에 시스템을 \r\n구축하여 실제 교통신호 운영에 활용 중\r\n적용 기술\r\n∙ (AI 영상분석 기반 차량 인식·추적 기술) 도로 영상에서 차량을 인식하고 차종, 교\r\n통량, 대기행렬 등 교통정보를 추출하는 기술\r\n∙ (교통수요 가공·분석 기술) 녹색신호동안 처리된 교통량과 대기행렬 등을 결합하여 \r\n접근로 및 회전별 교통수요를 산정하는 기술\r\n∙ (신호운영 파라미터 산정 기술) 교통수요정보를 통해 주기, 현시별 녹색시간 등 현장 \r\n적용이 가능한 신호제어 파라미터를 산출하는 기술\n구분 내용\r\n∙ (LLM 기반 운영정보 분석 기술) 교통상태, 신호제어 결과 및 센터시스템 운영정보 등\r\n을 연계하여 주요 변화, 이상징후 및 운영상황을 분석·해석하는 기술\r\n∙ (LLM 기반 의사결정 지원 기술) 분석결과를 자연어로 요약하고 원인 및 대응방향을 \r\n제시하여 운영자의 교통운영 판단을 지원하는 기술\r\n서비스 대상 ∙ 지자체 및 경찰 등 교통신호 운영·관리 주체와 센터 운영자\r\n∙ 신호교차로와 주요 도로축을 이용하는 도로 이용자\r\n추정 비용\r\n적용 사례 ∙ 군포시, 안양시, 안성시, 군산시, 경주시, 울산시, 강릉시 등 다양한 지자체 교통 신호운\r\n영 현장에 적용\r\n입력데이터\r\n∙ 스마트교차로 영상 정보\r\n∙ 접근로 및 회전별 교통량 정보\r\n∙ 현장 신호제어기 운영상태 정보\r\n∙ 센터시스템 상태 및 장애·이벤트 정보\r\n출력데이터\r\n∙ 교차로별 최적 신호주기 및 현시별 녹색시간 정보\r\n∙ 현장 신호제어기 적용상태 및 운영 결과 정보\r\n∙ 운영자 의사결정을 위한 자연어 요약 및 대응방향 정보\r\n서비스 이미지\r\n사진1 사진2\r\nVehicle Classification Traffic Flow\r\nTraffic Volume Queue lane\r\n데이터허브 \r\n연계 여부 및 \r\n참여 조건\r\n∙데이터허브 연계 가능 여부: þ 가능 □ 불가(사유 ) ∙참여 조건 : \r\n- 데이터 허브와 센터시스템 간 교통정보 송수신을 위한 연계 인터페이스 및 통신환경 \r\n확보 필요\r\n- 영상 원본 등 개인 식별 가능성이 있는 데이터는 관련 법령 및 기관의 개인정보·보안\r\n정책에 따라 비식별 처리하거나 연계 대상에서 제외","분류\r\n번호 30 도시데이터 기반 오픈랩 유형 근로·고용\r\n서 비 스 개 요 ž 도시데이터 기반의 신규 솔루션 개발\r\nž 창업을 위해 학습용 데이터, 컨설팅, 클라우드 기반 서버 등 컴퓨팅 자원을 제공\r\n주 요 기 능\r\nž CCTV 등 AI 학습용 도시데이터 구축·개방\r\nž 데이터 처리를 위한 알고리즘, 컴퓨팅 자원(GPU 등) 제공\r\nž 도시 데이터 인프라를 통합하여 도시 데이터 통합관리 및 활용\r\nž 도시데이터를 수요자가 편리하게 이용할 수 있도록 데이터마켓 구축\r\n목 표\r\nž 국민이 참여할 수 있는 정책과제 발굴 및 민간 간 다양한 협력 모델을 지원하여 도시혁신 \r\n기반 조성\r\nž 데이터 기반의 제품·서비스 창출을 통해 중소·벤처기업의 활동을 촉진하고 신산업 토대 \r\n강화에 기여\r\n현 재 수 준\r\nž 도시 내 다양한 스마트 인프라로부터 수집되는 데이터의 통합 관리 체계 부재\r\nž 도시 운영 기술이 진화됨에 따라 데이터 기반 도시 운영의 필요성 증대\r\nž 행정구역 범위 내 단위 서비스로 활용에 제약\r\nž 데이터 분석 기반의 안전 사고 및 재해 사전 예방 필요성 대두\r\n적 용 기 술 ž AI·빅데이터 분석 및 예측, 비정형 데이터 분석, 복합데이터셋 및 벡터데이터 생성, 서비스·데이터·플랫폼 상호연동 인터페이스, 사용자 친화적 UX 기반 셀프서비스 플랫폼\r\n서 비 스 대 상\r\nž 플랫폼 서비스 제공자, 서비스 개발자(중소·벤처\r\n기업, 스타트업 등), 대\r\n학 및 연구소, 시민, 공\r\n무원 등\r\n적 용 사 례\r\nž 광역지자체 17개소, 인천광역\r\n시, 충청남도, 제주도, 코펜하\r\n겐(덴마크), 암스테르담(네덜란\r\n드)\r\n추 정 비 용 ž 데이터허브 2.0 \r\n연계 가능성(신규)\r\nž (1단계) 공공·민간·개인데이터 및 CCTV·교통·주차·시설·환경 등 도시데이터 수집·통합\r\nž (2단계) AI 기반 도시데이터 분석·예측·이상탐지 및 데이터 정제·표준화·정합성 확보\r\nž (3단계) 도시운영 최적화, 정책 의사결정, API·앱 개발 및 데이터 마켓플레이스·창업\r\n지원 서비스 활용\r\n입력데이터(신규)\r\nž IoT 플랫폼 수집데이터, 기존 도시정보시스템 데이터, 공공데이터 API, 공공데이터, 민간데이터, 개인데이터, 비정형 데이터(CCTV, 112, 119 신고 정보 등)\r\n출력데이터(신규)\r\nž 정제·가공된 AI 학습용 데이터, 공공·민간·개인 융합데이터셋, AI 모델 및 분석결과, 데이터 상품·거래·이용정보\r\n후보 KPI (신규)\r\nž 도시데이터 개방건수(건)\r\nž 데이터셋 이용·거래건수(건)\r\nž 데이터 품질 적합률(%)\r\nž 창업·사업화 지원건수(건)\r\n확 산 리 스 크 \r\n1차 판정( 신 규 )\r\nž 스마트학교 정보화 특화 실시설계 및 구축예산 확보 주체·방안 마련 필요\r\nž 국토교통부·교육부·교육청 간 협력관계 정립 필요\r\nž 시범도시 내 신설학교 설립계획 수립·추진 필요\r\nž 교육청의 컨셉과 예산에 따라 스마트학교 조성 여부가 변경될 가능성\n□ 서비스 이미지","분류\r\n번호 31 인공지능 기반 스마트도시 APP 유형 기타\r\n서 비 스 개 요 ž 스마트도시서비스 이용 편의 향상을 위한 인공지능 기반 모바일 어플리케이션\r\n주 요 기 능\r\nž (블록체인 기반 분산인증) 다종의 신분증(시민증, 주민등록증, 학생증 등)을 블록체인 \r\n기반으로 개인의 신원을 인증하여 앱 서비스 가입자를 관리할 수 있는 기능\r\nž (AI 기반 스마트서비스 추천) 사용자 위치 등 연계데이터 관련 AI 분석을 통해 연령, 성별, 위치에 맞는 도시데이터 서비스를 맞춤형으로 제공하는 기능\r\nž (PM 사용자 안내) 데이터 캡처링 앱과 연계하여 영상인식 기반 안전정보 제공기능\r\n목 표 ž 지역특화 서비스 및 플랫폼 이용자 대상 위치와 기후데이터를 연계한 인공지능 기반 \r\n도시서비스를 제공\r\n현 재 수 준\r\nž 청년창업, 시민참여, 지역화폐 등 스마트도시 서비스 개별 운영 단계\r\nž 서비스 간 데이터 및 시스템 연계 미흡으로 통합 서비스 제공 한계 존재\r\nž 시민참여 포인트와 지역화폐 간 연계·전환 체계 구축 필요\r\n적 용 약자(어린이·치매노인) 보호 서비스\r\n목 표 ž 공공안전 분야 서비스 연계를 통한 긴급상황 골든타임 확보 및 국민 생명·재산 보호\r\n현 재 수 준\r\nž 스마트시티 통합플랫폼 국가 R&D 개발 완료 및 2015년부터 국토교통부 국비지원 사업\r\n을 통한 지자체 보급 상용화 단계\r\nž 2021년까지 108개 지자체 구축 계획, 2020년 이후 기초 지자체(229개소) 및 광역센터\r\n(17개 시·도) 구축 병행 확대\r\nž 향후 지속적인 연계서비스 추가에 따른 고도화 진행 중(사회적 약자지원 서비스에 민간보\r\n안-공공안전 연계, 전자발찌 범죄피해 예방 등 추가)\r\n적 용 기 술 ž CCTV, 스마트시티 통합플랫폼, NDMS(국가재난관리시스템), VMS, 정보통신망\r\n서 비 스 대 상\r\nž 경찰, 소방, 재난안전상황\r\n실, 어린이·치매환자 등 \r\n사회적 약자, 위치추적센\r\n터, 시민\r\n적 용 사 례\r\nž 대전광역시, 서울특별시, 제주도 \r\n등 스마트시티 통합플랫폼 사업 \r\n대상 12개 지자체, 경상남도 함\r\n양군 추 정 비 용 ž 데이터허브 2.0 \r\n연계 가능성(신규)\r\nž (1단계) CCTV 영상, 112·119 신고정보, NDMS 재난·사고·질병 정보, 통신사 위치정\r\n보, 법무부 전자발찌 위치추적 정보 수집·통합\r\nž (2단계) 스마트시티 통합플랫폼 기반 긴급상황 실시간 분석 및 관계기관 간 데이터 \r\n정합성 확보\r\nž (3단계) 112·119 긴급출동 지원, 재난상황 긴급대응, 사회적약자 보호, 민간보안-공공\r\n안전 연계, 전자발찌 범죄피해 예방 서비스 활용\r\n입력데이터( 신 규 ) ž CCTV 영상, 112 신고정보, 119 신고정보, NDMS 재난·사고·질병 정보, 통신사 위\r\n치·사진 정보, 전자발찌 위치추적 정보\r\n출력데이터( 신 규 ) ž 현장 영상(신고자 인근 CCTV 영상), 범인 도주경로 정보, 화재현장 영상, 교통정보, VMS·안내방송 정보, 소재 및 현장 상황 정보\r\n후 보 K P I ( 신 규 )\r\nž 골든타임 확보율(%) ž 긴급영상 제공 소요시간(초) ž 사고피해 최소화율(%) ž 재난정보 시민 전파 소요시간(분)\r\n확 산 리 스 크 \r\n1 차 판 정 ( 신 규 )\r\nž 경찰·소방·재난안전상황실·법무부 등 다수 유관기관 간 정보 연계에 따른 운영 거버넌스 차이\r\nž 도시통합운영센터(CCTV관제센터 포함) 구축 여부 및 정보시스템 운영환경, 센터 전담조직· 인원 등 지자체별 인프라 여건 차이\r\nž 지자체 당 50% 매칭 방식에 따른 지자체 재정 여건별 사업 참여 격차\n□ 서비스 이미지","분류\r\n번호 35 AI 이륜차 사고자동신고 \r\n시스템\r\n유형 교통\r\n서 비 스 개 요\r\nž 이륜차에 AI-IoT 사고알림장치를 설치하여 사고를 자동 감지하고, 지자체 관제센터·보\r\n호자·112·119 등 지역안전망과 연계하여 사고자의 신속한 발견과 구조를 지원하는 서\r\n비스\r\n주 요 기 능\r\nž IoT 모션센서 : 이륜차의 주행·움직임·충격 등 실시간 모션데이터 수집\r\nž 클라우드 AI 기반 사고 자동감지·재확인 : 실시간 시계열 데이터 기반 사고를 자동 감\r\n지 및 재확인 모델로 사고 여부 판단\r\nž 사고 알림 및 긴급대응 연계 : 사고 판단 시 위치·상태를 관제하고 보호자에게 자동 \r\n알림, 필요 시 112·119 긴급대응 연계\r\n목 표 ž 사고 후 스스로 신고하기 어려운 고령 이륜차 운전자의 사고를 신속·정확하게 발견하\r\n여 구조 골든타임을 확보하고, 기존 지역안전망의 사각지대를 해소\r\n현 재 수 준\r\nž (현장실증완료) 충남 예산군 등 실제 지역에서 지자체·경찰·소방과 연계한 이륜차 사고 \r\n자동감지·대응체계 구축 및 운영\r\nž (생명구조 12명 성과) 실제 사고현장에서 고령 이륜차 이용자 등 12명 구조, 참여자 \r\n사망 0명\r\nž (구급신고시간 94% 단축) 기존 56분에서 3분 내외로 감소\r\nž (사회적비용 약 22억원 절감) 이륜차 운전자 사망사고 예방과 사고피해 경감 비용\r\nž (사업의 경제성 확보) : 편익/비용=2.57로 경제적 효과 있음\r\n적 용 기 술 ž IoT 모션센서, LTE 이동통신, GNSS 위치정보, 클라우드, 인공지능(LSTM·이상치 탐\r\n지 등), 웹 기반 관제 플랫폼, 빅데이터, AP \r\n서 비 스 대 상\r\nž 고령 이륜차 운전자, 농어\r\n촌 주민, 배달라이더 등 \r\n이륜차 이용자\r\nž 지자체·교통안전기관·경찰· 소방 등 지역안전관리기관 적 용 사 례 ž 충남 예산군, 서울 은평구, 서\r\n울 성동구, 서울 강남구 \r\n추 정 비 용 ž 데이터허브 2.0 \r\n연계 가능성(신규)\r\nž (1단계) 이륜차 운행·사고 데이터 수집 및 표준화\r\nž (2단계) 지역 교통·안전 데이터와 연계하여 사고 및 위험정보 분석\r\nž (3단계) 자체 안전정책·교통환경 개선 및 지역 단위 안전관리 서비스로 활용\r\n입력데이터( 신 규 ) ž IoT 모션센서 데이터, GNSS 위치정보, 운행시간·경로 데이터, 차량 상태정보, 사고 \r\n이벤트 데이터\r\n출력데이터( 신 규 ) ž 사고감지 이벤트, 사고 위치·시간, 사고판단 결과, 긴급알림 정보, 운행·사고 이력, 지\r\n역별 사고·위험 통계\n□ 서비스 이미지\r\n후 보 K P I ( 신 규 )\r\nž 사고 감지 정확도 (%) ž 사고 감지 소요 시간 (분) ž 사고 발생 후 구조기관 연계 시간 (분) ž 실제 사고 대응·구조 건수(건) ž 서비스 참여자 중대·사망사고 변화율 (%)\r\n확 산 리 스 크 \r\n1 차 판 정 ( 신 규 )\r\nž 오인신고 관리: AI 재확인 및 관제 검증을 통한 불필요한 112·119 출동 최소화\r\nž 개인정보·위치정보: 개인위치정보 보호 및 적법한 관리체계 필요\r\nž 기관 연계: 지자체·경찰·소방 간 대응 프로세스 사전 협의 필요\r\nž 지속운영: 단말기·통신·관제 유지관리 예산 확보 필요","관리\r\n번호 36 AI 기반 고밀도 3D 공간정보 현장 대응 플랫폼 유형 행정 / \r\n시설물 관리\r\n구분 내용\r\n서비스 개요\r\n∙ AI 기반 고밀도 3D 공간정보 현장 대응 플랫폼은 2m 간격의 360도 이미지·3D \r\nLiDAR 스캔과 AI 객체 인식을 통해 도시 시설물의 최신 상태를 자동 파악하고 행정 \r\n현장 대응에 연계하는 서비스\r\n① 촬영 : 차량·오토바이·도보로 2m 간격 360도 이미지 및 3D LiDAR 스캔 취득\r\n② 분석 : AI 객체탐지로 배수구·난간·맨홀 등 시설물 종류와 손상 여부를 공간 좌표와 \r\n함께 자동 식별\r\n③ 대응 : 이전 회차 데이터와의 변화탐지 결과를 점검·정비 등 행정업무에 연계\r\n④ 신고 : 3D 공간 좌표에 직접 신고·메모를 남기고, 출동 전 접근 경로를 사전 파악해 \r\n초기 대응 시간 단축\r\n서비스 배경\r\n(도시문제 등)\r\n[반복되는 사각지대]\r\n∙ 기존 로드뷰(카카오 로드뷰, 네이버 거리뷰)는 약 10m 간격의 단순 360도 사진 방식\r\n으로, 촬영 차량 등에 시설물이 가려지거나 골목길까지는 촬영이 되지 않는 한계\r\n[벌어지는 거리뷰 시차]\r\n∙ 지역별 영상 갱신 주기가 상이해(서울 연 1~2회, 지방 6~10년 소요 사례) 촬영 시점과 \r\n현재 현장 간 시차가 발생, 오래된 영상으로는 AI 객체탐지·변화탐지의 실효성 저하\r\n[제한된 현장 확인]\r\n∙ 시설물 파손 신고 시 인근 CCTV 영상만 확인 가능해 확인 범위가 제한적이고, 정확한 \r\n신고 위치 특정과 접근 경로 사전 파악이 어려워 초기 대응 지연\r\n주요 기능 [고밀도 공간정보 구축]\r\n∙ 차량·오토바이·도보 촬영 장비로 2m 간격 360도 이미지 및 3D LiDAR 스캔 주기\n구분 내용\r\n적 취득(골목길까지 가능)\r\n◦ 촬영 차량을 제거한 보정 영상을 제공해 시설물이 가려지지 않은 상태로 현장 확인\r\n[AI 시설물 자동 진단]\r\n∙ AI 객체탐지로 막힌 배수구·파손된 난간·손상된 맨홀 등 시설물 종류와 균열·손\r\n상 여부를 공간 좌표와 함께 자동 식별·분류\r\n∙ 이전 회차 데이터와 비교하는 시맨틱 기반 변화탐지로 변화 구간을 추출해 점검·정비 \r\n등 행정업무에 연계\r\n[현장 대응 지원]\r\n∙ 3차원 공간 좌표 위에 신고 위치·대상 시설물·특이사항을 직접 메모 형태로 기록\r\n(누구나 촬영·확인 가능)\r\n∙ 최신 360도·LiDAR 데이터로 접근 경로와 진입 방향을 출동 전 사전 파악해 초기 \r\n대응 시간 단축\r\n목 표\r\n[정보 최신화]\r\n∙ 로드뷰 갱신 주기의 한계(서울 연 1~2회, 지방 6~10년)를 개선해 골목길까지 포함한 \r\n최신 공간정보를 주기적으로 확보\r\n[진단 자동화]\r\n∙ AI 기반 시설물 자동 식별·변화탐지로 점검·정비 업무의 판단 근거를 신속히 제공\r\n[대응 신속화]\r\n∙ 신고 위치 특정 및 접근 경로 사전 파악으로 신고 접수부터 현장 도착까지의 시간을 단축\r\n현재 수준\r\n[촬영·스캔 기술]\r\n∙ 차량·오토바이·도보 등 촬영 수단을 활용해 2m 간격으로 360도 이미지 및 3D \r\nLiDAR 스캔 취득 가능\r\n[AI 분석 기술]\r\n∙ AI 기반 객체탐지·시설물 분류 및 이전 회차 데이터와의 시맨틱 변화탐지 적용\r\n[영상 보정 기술]\r\n∙ 촬영 차량을 제거한 360도 보정 영상 제공 기술(스티칭) 확보\r\n적용 기술\r\n[3D LiDAR·360도 스캔 촬영 기술]\r\n∙ 차량·오토바이·도보 탑재형 촬영 장비로 2m 간격 360도 이미지 및 3D LiDAR 포\r\n인트클라우드 동시 취득","구분 내용\r\n[공간 데이터 구조화 기술]\r\n∙ 단순 사진이 아닌 공간 좌표 기반 데이터 구조로 촬영 정보를 구축해 통합플랫폼과\r\n의 연계 지원\r\n[AI 객체탐지·시설물 분류 기술]\r\n∙ 배수구·난간·맨홀 등 시설물 종류와 균열·파손 여부를 공간 좌표와 함께 자동 식별\r\n[시맨틱 기반 변화탐지 기술]\r\n∙ 이전 회차 데이터와 비교해 시설물 상태 변화 구간을 자동 추출\r\n[영상 보정 기술]\r\n∙ 촬영 차량 등 가림 요소를 제거한 보정 영상 생성\r\n서비스 대상\r\n∙ 지방자치단체 도로·시설물 관리 부서(배수구, 난간, 맨홀 등 도시 시설물 점검·정비 담당자)\r\n∙ 지자체 통합관제센터·상황실 운영 인력(민원·신고 접수 및 현장 대응 담당자)\r\n∙ 시설물 파손 신고 민원인(신고 위치와 현장 상태를 사전 확인하고자 하는 시민)\r\n추정 비용\r\n적용 사례\r\n[상용화·실적 검증 단계]\r\n∙ 2007년부터 네이버 거리뷰 제작을 통해 200만km 이상 고정밀 도로 영상 공급 실적 보유\r\n∙ 2014년부터 고정밀 도로 네트워크 및 360도 전방위 공간영상 동시 취득 시스템 개발·운영 중\r\n[기술 특허 확보]\r\n∙ 무인공공정보 수집 시스템의 방법 특허 등록 완료(특허 10-2328506)\r\n∙ 도로수집장치 특허, 촬영장치 특허, DSLR 기반 자동촬영장치 보유\r\n입력데이터\r\n[촬영 원시 데이터]\r\n∙ 차량·오토바이·도보 촬영 장비로 취득한 2m 간격 360도 이미지 및 3D LiDAR 포\r\n인트클라우드 데이터\r\n∙ 촬영 위치(GPS 좌표), 촬영 시각, 촬영 경로 정보\r\n[시설물·환경 정보]\r\n∙ 기존 통합플랫폼·GIS 연계 시설물 대장 정보(배수구, 난간, 맨홀 등 위치 및 관리 이력)\r\n∙ 이전 회차 촬영 데이터(변화탐지 비교용)\r\n출력데이터\r\n[공간 데이터]\r\n∙ 2m 간격 고밀도 360도 이미지 및 3D LiDAR 공간데이터(통합플랫폼 연계 가능한 구조)\r\n∙ 촬영 차량 등을 제거한 보정 영상\r\n[시설물 진단 결과]\n구분 내용\r\n∙ AI 객체탐지 기반 시설물 종류·위치(공간 좌표)·손상 여부 판정 결과(배수구, 난간, 맨홀 등)\r\n∙ 이전 회차 대비 변화탐지 결과(변화 구간, 손상 진행 여부)\r\n[현장 대응 정보]\r\n∙ 3D 공간 좌표 기반 신고 위치·대상 시설물·특이사항 메모 데이터\r\n∙ 출동 인력을 위한 접근 경로·진입 방향 사전 안내 정보\r\n서비스 이미지\r\n사진1 사진2\r\n데이터허브 \r\n연계 여부 및 \r\n참여 조건\r\n∙ 데이터허브 연계 가능 여부(þ체크): þ 가능 □ 불가(사유 )\r\n∙ 참여 조건 : 개인정보, 민감정보 비실명화 또는 삭제","관리\r\n번호 37 고독사 예방 통합 모니터링 시스템 유형 보건ㆍ의료ㆍ복지\r\n구분 내용\r\n서비스 개요\r\n똑똑안부확인서비스는 별도의 기기 설치 없이 통신 수·발신 데이터를 활용해 취약계층의 안\r\n전을 상시 확인하는 고독사 예방 서비스\r\n① 모니터링 — 대상자별 맞춤 주기로 통신 수·발신 활동을 자동 감지\r\n② 확인 — 통신 활동이 없으면 자동 안부전화로 안전 여부 확인\r\n③ 대응 — 미응답 시 담당자에게 즉시 확인요청 정보 전달, 신속 조치\r\n(+ 확장) 위험도에 따라 앱, 문열림센서, 스마트플러그를 연계해 생활데이터 기반 통합\r\n서비스 배경\r\n(도시문제 등)\r\n[늘어나는 위험] ◦1인가구와 사회적 고립가구의 증가로 고독사 위험이 확대되고 있어 위험을 조기에 포착하\r\n는 상시 모니터링 체계가 요구\r\n[감당 어려운 현장] ◦한정된 복지 인력으로 다수 대상자를 매일 확인하는 것은 현실적으로 불가능해, 저비\r\n용·대규모 관리와 대상자별 맞춤 적용을 동시에 만족하는 안부확인 서비스 필요\r\n[기존 방식의 벽] ◦기존 IoT 돌봄서비스는 기기 설치와 유지관리 부담과 일상생활 방해라는 한계\r\n주요 기능 [상시 안전 감지] ◦대상자별 맞춤 주기로 통신 수·발신 활동을 모니터링하여 통신 활동 유무 확인\n구분 내용\r\n◦통신 이력이 없으면 자동 안부전화(ACS)를 최대 2회 발신해 응답 확인\r\n[신속 대응 연계] ◦미응답 시 확인요청 대상자 목록을 문자, 이메일로 담당자에게 즉시 전달\r\n◦관리자 웹에서 대상자 현황, 통신활동, 안부전화 결과, 조치 이력을 통합 관리\r\n[정밀 모니터링 & 능동 신고] ◦고위험군은 문열림센서, 스마트플러그, 앱 등 생활데이터를 선택 연계해 정밀 모니터링\r\n◦앱 응급호출(SOS)로 능동신고 가능, 신고 위치 기반 인근 CCTV 최대 5개 연계로 즉시 \r\n대응\r\n목 표\r\n데이터 기반 상시 안부확인으로 복지사각지대의 고독사를 예방하고 지역사회 안전망을 강화\r\n [조기 발견] ◦통신 수·발신 데이터와 자동 안부확인으로 고독사 위험신호를 조기에 포착\r\n [맞춤 관리] ◦대상자 특성과 위험도에 따라 생활데이터를 연계한 통합 모니터링 제공\r\n [신속 대응] ◦위험 감지 시 담당자 연계 및 능동적 대응 체계로 신속하게 조치\r\n현재 수준\r\n◦2018년부터 공공기관에서 도입, 운영 중인 상용 서비스 단계\r\n◦GS인증과 관련 특허, 조달청 혁신제품(2023년)을 보유한 고독사 예방 통합서비스\r\n◦전국 27개 지방자치단체와 국가보훈부에서 운영 중이며 약 5만 명 규모의 대상자를 관\r\n리\r\n◦지방자치단체의 정보화 환경과 운영방식에 따라 클라우드형 또는 기관 내 서버 구축형으\r\n로 적용 가능\r\n적용 기술\r\n[AI 기반 통신활동 패턴 분석 기술] ◦대상자별 통신 수·발신 데이터를 학습해 평소 생활패턴을 모델링하고 개인별 최적 안\r\n부확인 주기를 산출 및 조정\r\n[AI 위험도 예측 및 대상자 자동 선별 기술] ◦통신활동 이력과 생활데이터를 종합 분석해 고독사 위험도를 스코어링하고, 이상징후가 \r\n감지된 대상자를 자동 선별과 우선순위화\r\n[ACS 자동발신 및 응답 결과 지능형 분석 기술] ◦자동 안부전화 발신과 응답/미응답 결과를 수집, 분석해 대응 시급도를 자동 판정\r\n[지능형 관제 대시보드 및 자동 알림 기술] ◦확인요청 대상자 자동 알림과 함께 대상자 현황, 위험도, 조치 이력을 통합 시각화하고 \r\n우선 대응 대상을 자동 제시\r\n서비스 대상\r\n◦고독사 위험이 있는 1인가구, 사회적 고립가구, 독거노인, 중장년 1인가구 ◦지방자치단체 복지부서, 보건 또는 복지기관 및 국가보훈기관 등 대상자의 안전을 확인\r\n하고 관리하는 공공기관 담당자\r\n추정 비용","구분 내용\r\n적용 사례\r\n◦전국 27개 지방자치단체에서 지역 내 고독사 위험가구, 독거노인 및 중장년 1인가구 등\r\n을 대상으로 운영\r\n◦국가보훈부‘보보안심콜’을 통해 전국 27개 지방보훈관서의 국가유공자를 대상으로 안\r\n부확인 서비스 운영\r\n◦약 5만 명 규모 대상자의 설정 주기별 통신활동 여부를 자동으로 확인하고 통신 수·\r\n발신 이력이 없는 대상자를 선별하여 담당자의 전화 및 방문 확인 지원\r\n입력데이터\r\n[대상자 기본정보 및 서비스 설정정보]\r\n◦ 대상자 이름, 생년월일, 연락처, 주소, 복지수급정보, 위험군(저/중/고), 담당기관, 담당\r\n자, 주기 등\r\n[대상자 생활 데이터]\r\n◦ 일별 발생한 수·발신 횟수, 걸음수, 문열림횟수, 전력변화 횟수\r\n[담당자 조치 이력]\r\n◦ 자동 안부전화 발신 및 응답 결과\r\n◦ 담당자의 전화 확인, 방문 확인 및 사후조치 이력\r\n출력데이터\r\n[안부확인 결과 데이터]\r\n◦ 대상자별 주기 내 통신활동 유무 판정 결과\r\n◦ 확인요청 대상자 자동 선별 목록 (미활동, 미응답 대상)\r\n◦ 자동 안부전화(ACS) 발신 이력 및 응답/미응답 결과\r\n[위험 판정·모니터링 데이터]\r\n◦ 대상자별 위험도 판정 결과 (생활데이터 기반, 위험군별 상태값)\r\n◦ 생활데이터 이상징후 감지 결과 (걸음수, 문열림, 전력변화 등 패턴 이탈 여부)\r\n◦ 대상자별 통합 모니터링 현황 (통신, 생활데이터 종합 상태)\r\n[대응·관리 데이터] ◦담당자 확인요청 알림 발송 내역 (문자, 이메일, 발송 시각, 수신자) ◦담당자 조치 이력 (전화 확인, 방문 확인, 사후조치 결과 및 처리 상태) ◦관리자 대시보드 통계 (대상자 현황, 안부확인 결과, 조치율 등 집계)\n구분 내용\r\n서비스 이미지\r\n사진1 사진2\r\n[관리자용 웹 메인페이지]\r\n[대상자 모바일 앱]\r\n데이터허브 \r\n연계 여부 및 \r\n참여 조건\r\n◦데이터허브 연계 가능 여부(þ체크): þ 가능 □ 불가(사유 ) ◦참여 조건 : 개인정보보호법 등 관계 법령에 따른 데이터 처리 근거 및 기관 간 협약\r\n마련\r\n◦연계 범위: 개인식별정보를 제외한 대상자 상태정보, 안부확인 결과, 연계 서비스별 \r\n생활데이터 변화정보 및 통계정보 등을 기관 간 협의에 따라 표준 API 방식으로 연계\r\n가능\r\n◦세부 연계항목, 제공주기, 보유기간 및 이용목적은 데이터 제공기관과 수요기관 간 협\r\n의를 통해 결정","관리\r\n번호 38 AI 기반 탄력주차 서비스 유형 교통\r\n구분 내용\r\n서비스 개요\r\n∙ 탄력주차는 위치정보와 차량정보를 매칭하여 물리적 주차면을 디지털 주차면으로 전\r\n환하고, 주차면별 고정형 하드웨어 설치 없이 입차, 출차, 결제, 예약, 공유, 현황관리 \r\n서비스를 제공하는 SaaS 기반 주차관리 플랫폼 \r\n∙ 시민은 탄력주차 앱, QR 웹 또는 기존 지도, 모빌리티 앱을 통해 이용하고, 지자체와 \r\n운영기관은 관리자 웹을 통해 주차 현황과 운영 데이터를 통합 관리 \r\n서비스 배경\r\n(도시문제 등)\r\n[도심 주차문제]\r\n∙ 도심 주차문제는 주차면의 절대적인 부족뿐만 아니라 시간대와 지역에 따른 주차 수\r\n요, 공급의 불균형에서 발생\r\n[그림 1. 제1차 국토교통 공공기관 데이터 협의체 설명자료 및 교통환승지역(대구공항) 주차 문제 뉴스 기사]\r\n[설치 및 운영 비효율] ∙ 노상, 거주자우선주차장 등 기존 공영주차장은 관리원, 주차미터기, IoT 센서, 차단기 등\r\n의 설치, 운영 비용으로 인해 소규모 또는 분산된 주차면을 효율적으로 운영하기 어려움\r\n[그림 52 기존 주차장 관리(차단기, 카메라, 전산기, 주차관리원)] \r\n[유휴 주차공간의 낮은 활용성]\r\n∙ 거주자우선주차면, 도로 주변 유휴공간, 부설주차장 등 기존 공간이 특정 시간대에 \r\n사용되지 않더라도 시민이 빈자리 정보를 확인하거나 이용하기 어려움\r\n[주차 운영, 관리 데이터 분절]\r\n∙ 주차 서비스와 단속, 관리 데이터가 분리되어 있어 부정주차 확인, 요금 관리, 이용 \r\n현황 분석 및 정책 수립에 한계가 있음\r\n주요 기능\r\n[디지털 주차면 생성 및 이용 서비스]\r\n∙ 주차면 좌표와 차량번호를 매칭하여 물리적 주차면을 디지털 주차면으로 전환\r\n∙ 앱, QR 웹 및 기존 지도, 모빌리티 앱을 통한 주차면 검색, 입차, 출차, 결제, 예약 \n구분 내용\r\n및 공유 서비스 제공\r\n∙ 이용 조건을 충족한 차량은 주차면 진입, 이탈을 감지하여 자동 입차, 출차 처리하고 \r\n등록된 결제수단으로 자동 결제\r\n[그림 53 탄력주차 주차면 디지털화 플로우]\r\n[통합 운영·관리 및 단속]\r\n∙ 관리자 웹을 통해 주차면별 이용 현황, 운영시간, 요금, 매출, 부정주차 및 단속 현황\r\n을 실시간 관리\r\n∙ 고정형 CCTV, 단속차량, 지역 배달라이더 등 다양한 단속수단과 연계하여 부정주차 \r\n차량을 확인하고 증거자료 수집\r\n[그림 54 단속방식: 기존 vs 탄력주차]\r\n[데이터 연계 및 수요예측]\r\n∙ 공공 주차정보시스템과 민간 지도, 모빌리티 플랫폼을 API로 연계하여 동일한 주차\r\n정보를 다양한 서비스에서 활용\r\n∙ 주차장 이용데이터, 모바일데이터, 대중교통데이터 등을 분석하여 시간, 장소별 주차 \r\n수요를 예측하고 필요한 주차면을 탄력적으로 공급\r\n[AI 기반 고객지원]\r\n∙ AICC 챗봇, 콜봇을 통해 앱 설치, 입차, 출차, 요금 및 이용방법 관련 민원에 24시간 \r\n대응\r\n목 표\r\n∙ 기존 노상, 거주자우선, 노외, 부설주차장과 도로 주변 유휴공간을 디지털화하여 새\r\n로운 시설 설치를 최소화하면서 주차 공급 확대\r\n∙ 실시간 주차정보 제공으로 시민의 주차 탐색시간과 불법주정차를 줄이고 주차 이용 \r\n편의성 향상\r\n∙ 주차 서비스와 관리 데이터를 통합하여 지자체의 운영비용을 절감하고 데이터 기반 \r\n주차정책 수립 지원\r\n∙ 공공 주차정보를 민간 플랫폼과 연결하여 지역과 플랫폼에 관계없이 이용할 수 있는 \r\n개방형 주차 생태계 구축\r\n현재 수준\r\n∙ 상용운영 및 실증: 대구광역시 노상주차장 330면 상용 운영 중이며, 의정부시 국토교\r\n통부 혁신기술 실증사업 및 서울특별시 강남구 거주자우선주차장 시범사업 완료\r\n∙ AI 기능 고도화: AX-Sprint 지원사업을 통해 주차수요 예측, 주차면 탄력 공급, 거주"];const heads=['서 비 스 개 요','주 요 기 능','목 표','현 재 수 준','적 용 기 술','서 비 스 대 상','적 용 사 례','추 정 비 용','데이터허브 연계 가능성(신규)','입력데이터(신규)','출력데이터(신규)','후보 KPI(신규)','확 산 리 스 크','서비스 이미지'];function fmt(t){let z=esc(t).replaceAll('ž','•');for(const h of heads)z=z.replaceAll(h,'\n\n'+h+'\n');return z.replace(/\n/g,'<br>').replace(/(<br>){3,}/g,'<br><br>')}const old=window.renderService;window.renderService=function(){old();const box=document.querySelector('.service-info');if(!box)return;const s=SERVICES[si];box.innerHTML='<div class="service-count">후보 서비스 '+(si+1)+' / '+SERVICES.length+'</div><h2>'+s.num+'. '+esc(s.title)+'</h2><img class="pdf-card-image" src="card-'+String(si+1).padStart(2,'0')+'.png" alt="서비스카드 이미지"><div n단속 데이터, 기타 안전데이터, CCTV 영상, Edge Sound AI 음향데이터, 행정문서, 주차장 이용 현황 데이터\n□ 서비스 이미지\r\n출력데이터(신규)\r\nž STT 변환 텍스트 및 정규화 메타데이터(JSON), NGSI-LD 표준 데이터셋, 데이터카\r\n탈로그 메타정보, 안전위협 이벤트 데이터, 다매체 신고 및 긴급출동 이벤트, 주차장 \r\n혼잡도 시각화 정보, 주차 수급 불균형 구역 정보, 수요 예측분석 결과, 민원 자동분류 \r\n결과, 챗봇 응답 및 정책 리포트\r\n후보 KPI(신규)\r\nž 정책 활용 목적 데이터 수집률(%)\r\nž 민원데이터 자동분류 정확도(%)\r\nž AI 챗봇 응답 만족도(점)\r\nž 연계기관 데이터 연동 API 수 전체 대상 대비(%)\r\nž 카탈로그 기관·데이터셋 등록 이행률(%)\r\nž AI분석 대시보드 평균 응답시간(초)\r\n확 산 리 스 크 \r\n1차 판정(신규)\r\nž CCTV·음향·민원 등 데이터 제공 주체 간 활용범위, 법적책임, 기술 공유 수준에 대한 \r\n이견 등 데이터 소유·활용 갈등\r\nž 개인정보 및 민감정보 포함 데이터 활용의 법·제도적 제약성\r\nž NDMS 긴급출동 정보 및 관제 연계 시 경찰·소방 등 유관기관의 비협조 또는 기술 \r\n연동 미비\r\nž NGSI-LD 데이터 연계 표준의 미충족 가능성 및 지자체 간 호환성 차이\r\nž 지자체별 민원 유형 및 부서별 업무 흐름 기반 분류체계 재구성 필요","분류\r\n번호 2 AI 다중운집 안전도시 서비스 유형 방범·방재\r\n서 비 스 개 요 ž 인구, 도로 정체/소통, 날씨 환경 등을 활용하여 시·공간적 특성 기반으로 다중운집 위험\r\n도를 분석하는 스마트시티 데이터허브 기반 안전도시 서비스\r\n주 요 기 능\r\nž 다중운집 위험지역 대상 통신사 등 민간데이터 기반 인구운집 지점·규모·이동 패턴 분석\r\nž 실시간 인구 예측(1시간 단위, 향후 12시간 인구 예측 데이터 제공)\r\nž 실시간 인구 혼잡도 격자 시각화 및 보행 인구 규모 추정(시간대별 혼잡도 히트맵)\r\nž 실시간 도로소통 정보 및 실시간 날씨 정보 제공\r\nž 다중운집 위험지역 모니터링을 통한 사전 안전대책 마련 및 신속한 대응 체계 구축\r\n목 표 ž 다중 인파 밀집 사고로부터 인명 피해 예방을 위한 데이터 기반 재난 안전 서비스 체\r\n계 마련\r\n현 재 수 준\r\nž 부산광역시 중대재해예방과 선정 위험지역 4개소(광안리 해수욕장, 감천문화마을, 용두\r\n산공원, 기장 용궁사) 대상 운영, 2025년 2개소 추가 예정\r\nž Big-데이터웨이브(부산형 데이터 통합플랫폼)와의 연계 지원 방안 검토 필요\r\n적 용 기 술\r\nž 스마트시티 데이터허브 플랫폼(데이터 코어 모듈, 데이터 수집 모듈, API 게이트웨이 \r\n모듈, 인증/인가 보안 모듈), OAuth 2.0 기반 SSO, Docker 기반 컨테이너 운영, NiFi 데이터 수집 파이프라인, GeoServer, PostgreSQL, OPEN API 연계, GPS 기\r\n반 보행자궤적 분석, 시·공간 예측분석\r\n서 비 스 대 상 ž 지자체 공무원, 시민 적 용 사 례\r\nž 부산광역시 광안리 해수욕장, 감천문화마을, 용두산공원, 기\r\n장 용궁사 추 정 비 용 ž 데이터허브 2.0 \r\n연계 가능성(신규)\r\nž 통신사 실시간인구·GPS기반 보행자궤적·생활인구·관광인구, 국토교통부·한국교통안전공\r\n단·국가교통정보센터 버스정류소·지하철역·대중교통 승하차정보·교통소통정보, 국토지리\r\n정보원 경사도·도로·폭·길이·건축물 면적, 기상청 날씨/미세먼지 정보를 데이터 수집 모\r\n듈 프로토콜 변환 및 수집 파이프라인을 통해 코어 모듈에 적재·통합(1단계)\r\nž 데이터 모델(스키마) 기반 품질검사 수행 및 시·공간적 특성 기반 다중운집 위험도 예\r\n측분석을 통한 데이터 정합성 확보(2단계)\r\nž 다중운집 위험지역 모니터링 및 위험도 시뮬레이션 서비스 제공, 인구밀집도 분석 기\r\n반 보행로 개선 등 데이터기반 의사결정 지원, 다중인파관리를 통한 지역 축제 안전관\r\n리 및 축제 성과 평가 활용(3단계)\r\n입력데이터(신규)\r\nž 실시간인구, GPS기반 보행자궤적, 생활인구, 관광인구, 버스정류소, 지하철역, 대중교\r\n통 승하차정보, 교통소통정보, 경사도, 도로, 폭·길이, 건축물 면적, 날씨/미세먼지 정\r\n보\r\n출력데이터(신규)\r\nž 다중운집 위험도 분석결과, 인구운집 지점·규모·이동 패턴 분석결과, 실시간 인구 혼잡\r\n도(격자), 보행 인구 규모 추정 히트맵, 12시간 인구 예측 데이터, 실시간 도로소통 정\r\n보, 실시간 날씨 정보\r\n후보 KPI(신규)\r\nž 다중운집 위험도 예측정확도(%)\r\nž 위험도 시뮬레이션 서비스 이용자 만족도(점)\n□ 서비스 이미지\r\n확 산 리 스 크 \r\n1차 판정(신규)\r\nž 통신사 실시간인구 및 GPS기반 보행자궤적 등 민간데이터 구매 기반 서비스로 지자체\r\n별 민간 데이터 제공사와의 계약·활용 범위에 대한 제약\r\nž 카드사·여신사·통신사 등 민간 보유 데이터의 지역별 개방 및 제공 수준 차이\r\nž 광역시–기초지자체 간 도시데이터 공동활용 체계 및 운영 거버넌스 차이","분류\r\n번호 3 소상공인 활성화 지원 \r\n서비스 (상권분석) 유형 근로·고용\r\n서 비 스 개 요 ž 소상공인 활성화 지원을 위해 상권별 인구·매출·창폐업·인프라 데이터를 분석하여 상권 \r\n부실징후를 모니터링하고 예측하는 스마트시티 데이터허브 기반 서비스\r\n주 요 기 능\r\nž 상권별(골목상권, 발달상권, 전통시장) 실시간 인구 및 상주인구 분석\r\nž 업종별 소비매출, 점포 창·폐업, 상권주변 인프라현황 데이터 분석\r\nž 접근편의성 및 인구밀도 분석 기반 상권변화율 산출\r\nž 상권부실징후 예측분석 결과 도출 및 분석영역 조회·변화지표 제공\r\nž 상권변동내역 분기 1회 반영을 통한 분석·예측 결과 현행화\r\n목 표 ž 상권 부실 회복을 위한 상권부실 징후 모니터링 및 예측 서비스 지원을 통한 소상공인 \r\n활성화 정책 수립 지원\r\n현 재 수 준 ž 부산 전역 골목상권·발달상권·전통시장 대상 운영, 중소상공인지원과 정책수립 지원 활용\r\nž Big-데이터웨이브(부산형 데이터 통합플랫폼)와의 연계 지원 방안 검토 필요\r\n적 용 기 술\r\nž 스마트시티 데이터허브 플랫폼(데이터 코어 모듈, 데이터 수집 모듈, API 게이트웨이 \r\n모듈, 인증/인가 보안 모듈), OAuth 2.0 기반 SSO, Docker 기반 컨테이너 운영, NiFi 데이터 수집 파이프라인, GeoServer, PostgreSQL, OPEN API 연계, 상권변화\r\n율 산출 및 부실징후 예측분석\r\n서 비 스 대 상 ž 지자체 공무원, 시민 적 용 사 례 ž 부산 전역 골목상권, 발달상\r\n권, 전통시장\r\n추 정 비 용 ž 데이터허브 2.0 \r\n연계 가능성(신규)\r\nž 통신사 실시간 인구·유동·직장·주거인구, 카드사 소비매출현황, 여신사 소득/소비액, 공\r\n공데이터 및 인허가 기반 점포 창·폐업, 주택유형별세대수 및 금융·의료·교육·문화·숙박\r\n시설 등 인프라, 발달상권·전통시장 공간데이터, 국토교통부·한국교통안전공단·국가교통\r\n정보센터 교통데이터, 한국부동산원 시세 데이터를 데이터 수집 모듈 및 수집 파이프\r\n라인을 통해 코어 모듈에 적재·통합(1단계)\r\nž 데이터 모델(스키마) 기반 품질검사 수행 및 접근편의성·인구밀도 분석을 통한 상권변\r\n화율 산출, 상권부실징후 예측분석을 통한 데이터 정합성 확보(2단계)\r\nž 상권 부실징후 모니터링 및 상권 시뮬레이션 서비스 제공, 중소상공인지원과 상권부실 \r\n방지대책 및 신규상권 발굴 정책수립 지원, 예비창업자·소상공인 지원 방안 마련 및 쇠\r\n퇴(정체)상권 선제적 대응·맞춤형 솔루션 제시 활용(3단계)\r\n입력데이터(신규)\r\nž 실시간 인구, 유동·직장·주거인구, 소비매출현황, 소득 및 소비 구간별 소득/소비액, 점\r\n포 창 간 \n□ 서비스 이미지\r\n1차 판정(신규)\r\n데이터 연계 및 운영 거버넌스 확보 필요\r\nž 공공건축물·스마트시설·교통·자원순환 등 부문별 데이터 수집 범위 차이에 따른 통합분\r\n석 제약","분류\r\n번호 5 안전플랫폼 및 재난재해 \r\n서비스 (한파폭염) 유형 방범·방재\r\n서 비 스 개 요 ž 재해재난(수재해, 경사지 붕괴, 폭염) 관련 센서 데이터를 실시간 수집·분석·공유· 전파하여 데이터 기반의 맞춤형 재해재난 대응 서비스를 제공하는 통합 안전플랫폼\r\n주 요 기 능\r\nž 경사지 붕괴 예·경보 서비스 (강우 데이터 및 기울기 센서 기반 5단계 위험도 평가) ž 도시홍수 상황인지 서비스 (실시간 기상관측 및 1·2차원 침수 예측 정보 제공) ž 폭염 저감 서비스 (상세 공간 단위 취약성 분석 및 Massive IoT 기반 저감장치 \r\n자동 제어) ž 위치 기반 재난 경보 전파 및 도시안전 모바일 앱 연동\r\n목 표 ž 분산된 재난 정보의 통합 공유 및 분석을 통한 시민 대피시간 확보 및 재해재난 \r\n피해 최소화\r\n현 재 수 준\r\nž 안전플랫폼, 경사지 붕괴 예·경보, 도시홍수 상황인지, 폭염 저감 서비스 및 모바일 앱 기술 \r\n실증 및 성과 검증 완료 단계\r\nž 경사지 붕괴 발생 시각의 정확한 예측 한계 및 야생동물·등산객에 의한 센서 노이즈 발생\r\nž 도시유출모형 검·보정을 위한 우수관로 수위 관측망 추가 확보의 비용 및 유지관리 측면 한계\r\nž 폭염 취약성 분석 및 저감장치 배치 최적화의 실시간 자동화 시스템 미구축\r\n적 용 기 술 ž Massive IoT, REST API, JSON, 2DIS 모형(2차원 도시유출모형), CFD(전산유체역학), \r\n나노미스트, AWS, ASOS, 이동평균법, 온도보정\r\n서 비 스 대 상 ž 재난상황실, 구호부서, 관\r\n제센터, 일반 시민 적 용 사 례 ž 대구광역시(북구 연암공원, 서구 \r\n비산동 및 인동촌 일대) 추 정 비 용 ž 데이터허브 2.0 \r\n연계 가능성(신규)\r\nž (1단계) 경사지 센서 데이터, 수위계 데이터, 환경 센서 데이터(온도, 습도, 미세먼지, 풍\r\n향, 풍속), 기상청 강우 관측/레이더 데이터, 사용자 GPS 위치 데이터 수집·통합\r\nž (2단계) 경사지 붕괴 알고리즘(이동평균·온도보정 적용), 1·2차원 침수 예측 해석 모형, CFD 기반 폭염 취약성 분석 및 데이터 정합성 확보\r\nž (3단계) 안전플랫폼 대시보드 표출, 위치 기반 도시안전 모바일 앱 경보 전파, 폭염저감\r\n장치 자동 제어 및 지자체 재난 대응 의사결정 지원 활용\r\n입력데이터( 신 규 ) ž 경사지 기울기(x, y축), 경사지 온도, 수위계 관측 수위, 환경 온도, 습도, 미세먼지, 풍향, 풍속, 기상청 강우 정보, 현장 지반 물성치, 사용자 GPS 위치 정보\r\n출력데이터( 신 규 ) ž 경사지 붕괴 위험도 단계, 수심, 월류량, 침수심, 침수면적, 홍수 예·경보, 폭염 취약성 등\r\n급 지도, 폭염저감장치 제어 신호, 위치 기반 재난 경보 메시지\r\n후 보 K P I ( 신 규 )\r\nž 수재해 발생 시 시민 대피시간(분) ž 폭염저감장치 온도저감률(%) ž 서비스 만족도(점) ž 경사지 붕괴 검증 정확도(%)\r\n확 산 리 스 크 \r\n1 차 판 정 ( 신 규 )\r\nž 경사지 센서 전원 유선화 시 한전, 지자체, 사유지 토지소유주 간 협의 및 법·제도적 권한 \r\n조정 제약\r\nž 지자체별 우수관로 수위 관측망 및 기상관측장비 등 방재 기초 인프라 구축 수준 및 데이터 \r\n표준화 차이\r\nž 폭염저감장치(나노미스트) 도입 시 조경 분야 수경시설 관련 국가 설계기준 미비 및 수질·상\r\n수도/전력 공급 연계 행정 절차적 한계\n□ 서비스 이미지","분류\r\n번호 6 지능형 CCTV 선별 관제 시스템 유형 방범·방재\r\n서 비 스 개 요 ž CCTV 영상 분석으로 사물·사람과 사고·재난 등 대상을 식별하여 인식함으로써 관제 \r\n기능을 직·간접적으로 지원하고 모니터링 효율성을 극대화하는 서비스\r\n주 요 기 능\r\nž 공간, 사물, 사람 식별 및 실시간 모니터링·이벤트 자동 탐지(배회, 침입, 유기, 싸움, 방화, 쓰러짐 등) ž 다중 CCTV 영상 속 사람과 차량 식별 및 이동 경로 추적\r\nž 개인정보 비식별화(얼굴, 번호판) 및 영상 반출 통제(암호화, 전용 플레이어) ž 딥러닝 기반 고속 검색 및 지능형 연기·화재 분석\r\n목 표 ž 인공지능 기반 CCTV 영상 분석 및 이상 상황 자동 탐지를 통한 대응 시간 최소화 및 \r\n시민의 재산과 인명 보호\r\n현 재 수 준\r\nž AI 기반 객체 탐지, 이벤트/행동 패턴 인식, 객체 추적, 개인정보 비식별화 기술 상용화 및 \r\n도입 단계\r\nž 서울시, 인천시, 경기도 오산시, 베트남 하이퐁시 등 국내외 지자체 중심 보급 확대 및 \r\n지능형 CCTV 단계적 전환 추진\r\nž 증가하는 CCTV 수 대비 관제 인력 증원 한계, 육안 관제 시 CCTV 영상 순환 사이에 \r\n발생하는 사건·사고 탐지 대응 지연, 관제 인력 변경 시 경험 차이에 따른 대응 지연 우려\r\n적 용 기 술 ž AI, 딥러닝, KISA-KCTC 인증 AI 알고리즘, Re-ID(재인식) 기술, 영상 암호화 기술\r\n서 비 스 대 상\r\nž CCTV 관제센터, 관제 요원, 지자체, 유관기관(경찰, 소방 \r\n등) 적 용 사 례\r\nž 서울시(CCTV 지능형 전환), \r\n인천광역시(지능형 CCTV \r\n보급), 경기도 오산시(지능형 \r\n선별 관제 시스템 도입), \r\n베트남 하이퐁시 안즈엉현 추 정 비 용 ž 데이터허브 2.0 \r\n연계 가능성(신규)\r\nž (1단계) CCTV 실시간 영상, 사물·사람·차량 객체 데이터, 불꽃·연기 및 산불 관련 데이터 \r\n수집·통합\r\nž (2단계) 딥러닝 기반 객체 탐지 및 차종/색상 분류, 행위/이벤트 분석, Re-ID 기반 궤적 \r\n추적 및 데이터 정합성 확보\r\nž (3단계) 지능형 방범 스마트관제, 긴급상황 즉각 통보, 유관기관 연계, 신속한 화재·재난 \r\n대응 서비스 활용\r\n입력데이터( 신 규 ) ž CCTV 실시간 영상, 저장 동영상, 불꽃·연기 상황 정보, 산불 데이터\r\n출력데이터( 신 규 ) ž 객체 감지·추적 정보(차종, 색상 등), 이벤트 자동 탐지 알림(배회, 침입, 유기, 싸움, 방화, 쓰러짐 등), 이동 경로 추적 데이터, 비식별화 영상, 시간대별 통계 및 프로파일링 정보\r\n후 보 K P I ( 신 규 )\r\nž 대응 시간 단축률(%) ž 관제 인력 1인당 관제 CCTV 수(대) ž 알고리즘 정확성(%) ž 고속 검색 처리 속도(초)\r\n확 산 리 스 크 \r\n1 차 판 정 ( 신 규 )\r\nž 개인정보보호 관련 법·제도에 따른 영상 비식별화 및 영상 반출 통제(암호화, 전용 플레이어 사용) \r\n준수 제약\r\nž 지자체 및 유관기관 간 긴급상황 정보 연계 및 데이터 공유 거버넌스 차이\r\nž 지자체별 기존 CCTV 인프라 환경 및 지능형 전환 정책 추진 속도 차이\n□ 서비스 이미지","관리\r\n번호 7 AI·디지털트윈 SOC 시설관리 유형 시설물 관리\r\n구분 내용\r\n서비스 개요\r\n∙ AI·데이터기반 디지털트윈 SOC 시설관리 서비스\r\n- AI와 데이터를 기반으로 도시 SOC 시설물 관리를 지원하는 서비스 \r\n= 데이터를 기반으로 디지털트윈화하여 AI기술을 결합하여 효율적인 시설물 관리 지원\r\n서비스 배경\r\n(도시문제 등)\r\n∙ 도시 노후화 및 인구 감소에 따라 도시기반시설 SOC관리 효율화 요구 \r\n- 노후 관리대상 SOC 시설 지속 증가\r\n- 인구 감소 및 노후 관리 대상 SOC 증가에 따른 1인당 관리 SOC 증가 지속\r\n- AI 및 데이터를 기반한 효율화된 행정관리 기능으로 대처 필요\r\n주요 기능\r\n∙ 스마트시티 데이터허브 및 AI 도시 데이터 연결이 가능한 국제 표준 방식의 3D 데이\r\n터 구축 및 활용 체계\r\n∙ 데이터 기반 관리 이력 및 AI 분석 기반 예지 기능 구현\r\n∙ 공공관리영역 중 교량, 경사면, 노후건축물 등에 대해 디지털트윈 국토 정보를 기반\r\n으로 OGC 국제 표준 데이터로 데이터 관리 모델을 고도화하고 SOC 시설 관리 활용\r\n∙ 스마트시티 통합 플랫폼 체계와 연계하여 AI 도시 경보시스템과 효율화 된 연계\r\n목 표\r\n∙ 디지털트윈 국토 서비스와 연계하여 공공 SOC 시설물 관리 효율화\r\n∙ 빅데이터 및 AI 기술을 기반으로 건설 엔지니이어와 동급의 AI 진단 서비스 제공\r\n∙ 공공 SOC 시설물 관리 이력에 대해 디지털트윈 체계로 제공하여 보다 발전된 SOC \r\n관리 서비스 제공\r\n현재 수준\r\n∙ 일부 선도 지자체 자체 디지털트윈 공공 SOC 서비스 운영(서울시, 세종시 등)\r\n∙ 스마트시티 데이터허브 및 AI 도시 데이터 연계를 위한 데이터 규격 체계와 연동되\r\n지 않으며, 독립적인 시스템 구조로 운영 중\r\n∙ 온프래미스형 서비스로 타 지자체에 이식이 어려우며 데이터 분석 및 활용에 대한 \r\nSaaS 형 서비스를 제공하지 못함\r\n적용 기술\r\n∙ 영상 및 센서 기반 데이터 표준화 기술\r\n∙ 비표준 데이터의 OGC 데이터 표준 변환\r\n∙ 국제 표준 OGC 데이터 기반 경량화된 3D 시각화 및 서비스 플랫폼 체계\r\n∙ 공공 SOC 서비스로 연계할 수 있는 행정자동화 연계(행안부 NDMS 연계 등)\r\n서비스 대상\r\n∙ 노후화된 SOC 관리 수요가 증가하는 지방자치단체 공무원\r\n∙ SOC 관리 행정 비용의 최적화를 요구하는 지방자치단체 \r\n∙ SOC 관리업무를 대행하는 지역 업체\r\n추정 비용\r\n적용 사례\r\n∙ 서울시 디지털 트윈 교량관리 시스템(2024)\r\n∙ 완주군 디지털 트윈 경사면 안전관리 시스템(2025)\r\n∙ 한국 도로공사 서해안 고속도로 교량유지관리(2025)\r\n입력데이터\r\n∙ 드론, 로봇 촬영 데이터(영상, LiDAR)\r\n∙ IoT 센서 데이터\r\n∙ 3D Point Cloud 데이터\r\n∙ 고정밀 DEM\n구분 내용\r\n출력데이터\r\n∙ 복합 정보기반 3D 시각화 데이터\r\n∙ 다충 정보표출이 가능한 3D 시각화 데이터 및 가공 체계\r\n∙ AI 결합 시물레이션이 가능한 3D 공간정보 체계\r\n∙ AI 및 데이터 분석 결과기반 행정자동화 보고서\r\n서비스 이미지\r\n사진1 사진2\r\n데이터허브 \r\n연계 여부 및 \r\n참여 조건\r\n∙데이터허브 연계 가능 여부(þ체크): ■ 가능 □ 불가(사유 ) ∙참여 조건 : 가공된 데이터기반 제공(민감정보 ","분류\r\n번호 8 재난 의사 결정 지원 시스템 유형 방범·방재\r\n서 비 스 개 요 ž 도심 지역 재난 예측 의사결정을 위해 3차원 공간정보 기반 시뮬레이션 데이터를 \r\n생성하는 기술\r\n주 요 기 능\r\nž 3D GIS 기반 재난 시각화 및 수치·AI 모델 활용 재난 시뮬레이션 (침수, 지진 등) ž 현장 요원 위치 기반 실시간 상황 보고 및 커뮤니케이션 모바일 애플리케이션 서비스\r\nž GPS 기반 최적 안전 대피로 및 우회 경로 안내\r\nž 노후 공공시설 변위 센서 연동 및 지반운동·건물 피해 시뮬레이션\r\n목 표 ž 공간정보 기반 시뮬레이션을 통한 도시 재난 피해 사전 예측 및 신속 대응을 통한 시민 \r\n안전 확보와 경제적 손실 최소화\r\n현 재 수 준\r\nž 3D GIS 재난 시각화, AI/수치 모델 시뮬레이션, 상황보고 앱 및 대피로 안내 솔루션 \r\n상용화 단계\r\nž 재난 유형별 영향 지역 및 피해 사전 예측 정확도 향상 필요\r\nž 재난 발생 시 관계 기관 협조 체계 및 대응 매뉴얼 실시간 현행화 체계 구축 필요\r\nž 현장 위기 상황 시 시민 대상 실시간 최적 대피 정보 공유 체계 고도화 필요\r\n적 용 기 술 ž 3D GIS, 3차원 공간 시각화, AI 모델, 수치 모델, PWA (Progressive Web Apps), \r\nGPS, 변위 센서\r\n서 비 스 대 상\r\nž 재난 대  탄\r\n소배출권 정보\r\n출력데이터(신규)\r\nž 에너지 통계분석정보, 에너지 수요·소비·공급 분석정보, 에너지 소비현황, 설비 성능·효율 분석\r\n정보, 실내외 환경정보, 에너지 소비량 예측정보, 설비 최적제어정보, 에너지 절감방안 및 절감\r\n효과, 온실가스 저감방안\r\n후보 KPI(신규)\r\nž 공공건물 에너지비용 절감률(%)\r\nž 에너지 관련 시설 운영·유지보수비 절감률(%)\r\nž 에너지 소비량 예측 정확도(%)\r\nž 온실가스 배출량 감축률(%)\r\n확 산 리 스 크 \r\n1차 판정(신규)\r\nž 공공건물의 에너지 활용 제어 협의 필요\r\nž 공공건물 데이터 수집 협조에 어려움이 있음.\n□ 서비스 이미지","분류\r\n번호 10 위험물질 이송차량\r\n관제 서비스\r\n유형 물류\r\n서 비 스 개 요 ž 위험물질 운송차량 사고상황 감시 및 사고감지 시 사고대응기관(소방청·경찰청 등) 전파를 \r\n통한 사고피해 최소화 서비스\r\n주 요 기 능\r\nž 운송계획정보(위험물질명, 적재용량, 운송경로) 수집 및 진입제한구역 안내\r\nž 관제요원의 운행상태 실시간 모니터링 및 이상운행 차량 중심 사고 확인\r\nž 이상운전 탐지 시 CCTV·운전자 통화 확인 및 재난대응 유관기관 사고정보 전파\r\nž 충격량·기울기 기반 사고감지 자동알림 및 SOS 요청\r\n목 표 ž 위험물질 운송차량 사고 감시 및 신속한 사고전파를 통한 사고피해 최소화\r\n현 재 수 준\r\nž 물류정책기본법 및 시행령·시행규칙 개정 후 한국교통안전공단 내 관리센터 설치 및 모\r\n니터링 시스템 구축 및 운영 중\r\nž 위험물질(1만 리터 이상), 지정폐기물(10톤 이상), 유해화학물질(5톤 이상) 등 기준 초과 \r\n차량 대상 모니터링 운영\r\n적 용 기 술 ž GPS, 무선통신, 차량 단말장치, 충격·기울기 감지센서, 위치정보 분석, 실시간 모니터링, 이상운행 탐지, CCTV 연계, 경로안내, 운행기록 자동전송, 운송안전 통합관리시스템 연계\r\n서 비 스 대 상 ž 위험물질 운송차량 운전자, 재난대응기관 적 용 사 례 ž 한국교통안전공단 위험물질운송 \r\n안전관리센터 추 정 비 용\r\n데이터허브 2.0 \r\n연계 가능성(신규)\r\nž (1단계)위험물질 운송계획정보, 차량 위치·운행정보, 운송차량 소유자·운전자 정보, 사\r\n고대응 정보 수집·통합\r\nž (2단계)속도, 진입제한구역 운행, 경로이탈, 무정차 장기운행, 과도한 진동·충격 등 이\r\n상운행 탐지 및 사고 여부 판단\r\nž (3단계)사고정보 전파, 통행제한구간 진입금지 알림, 안전운송 경로 안내 서비스 활용\r\n입력데이터(신규)\r\nž 운송계획정보(위험물질명, 적재용량, 운송경로), 차량 위치정보, 운행기록, 충격량, 기울기, 운송차\r\n량 소유자·운전자 정보, 운전자 SOS 요청\r\n출력데이터(신규)\r\nž 진입제한구역 안내정보, 통행제한구간 진입금지 알림, 이상운행 탐지정보, 사고정보(차량 위치, 위험물 정보), 목적지 경로정보, 운행기록 자동 전송 데이터\r\n후보 KPI(신규)\r\nž 이상운행 탐지 정확도(%)\r\nž 이상운행 및 사고감지 후 유관기관 전파 소요시간(분)\r\nž 전체 운행 중 진입제한구역·통행제한구간 미진입 운행 비율(%)\r\n확 산 리 스 크 \r\n1차 판정(신규)\r\nž 지자체별 진입제한구역 분포 및 위험물 운송차량 통행제한구간 지정 현황 상이\r\nž 소방청·경찰청·시도·한국도로공사·민자고속도로 등 재난대응기관 간 사고정보 전파 및 \r\n연계체계 차이\r\nž 지자체별 관제 운영 주체 및 권한 범위 차이에 따른 운영 거버넌스 차이\r\nž 위험물질 운송계획정보와 지자체 보유 데이터 간 항목·형식 표준화 수준 차이\n□ 서비스 이미지","분류\r\n번호 11 통합 모빌리티(MaaS) \r\n플랫폼\r\n유형 교통\r\n서 비 스 개 요 ž 하나의 앱에서 다양한 교통수단을 검색하여 최적경로 안내, 예약·결제 등 교통서비스\r\n를 제공하는 플랫폼 서비스\r\n주 요 기 능\r\nž 최적 교통수단 조합 및 경로 생성(AI 알고리즘 활용 최적 경로·교통수단 추천) ž 이용 대상 모빌리티 서비스 예약(좌석 선택, 맞춤형 경로 추천, 결제 일괄 처리) ž 실시간 대중교통 정보 제공(지하철 경로, 버스 위치, 정류장·지하철역 검색) ž 오픈 MaaS API 제공 및 다양한 모빌리티 사업자 간 연계\r\n목 표 ž 다양한 교통수단 통합 검색·예약을 통한 국민 이동 편의 개선 및 대중교통 이용 촉진\r\n현 재 수 준\r\nž 현대자동차의 수요응답형 교통수단 '셔클' MaaS 플랫폼(뚝타) 전환 및 전국 확산 진행 상\r\n용화 단계\r\nž 대도시권광역교통위원회 K-MaaS 서비스 개시, 한국철도공사 '코레일 MaaS' 누적 접속자 \r\n확대 추세\r\nž 광역교통·대중교통·공유 모빌리티 서비스가 개별 공급자의 각각 앱으로만 이용 가능해 2\r\n개 이상 운송수단 이용 불편, 교통상황에 따른 여러 운송수단 검토·비교 어려움에 따른 \r\n최적 이동 효율적 활용 한계 존재\r\n적 용 기 술 ž AI, 표준 Open API, 빅데이터, 클라우드, GPS(실시간 위치정보), 통합 결제·정산 시스템\r\n서 비 스 대 상\r\nž 시민, 항공, 고속·일반 버\r\n스, 도시철도, 수요응답형 \r\n버스, 택시, 자전거·킥보\r\n드 등 공유교통\r\n적 용 사 례\r\nž 현대자동차 '셔클'(경기도교통공사 \r\n협업, 안산시 대부도), 대도시권\r\n광역교통위원회 K-MaaS(한국도\r\n로공사), 한국철도공사 '코레일 \r\n추 정 비 용 ž MaaS'\r\n데이터허브 2.0 \r\n연계 가능성(신규)\r\nž (1단계) 운송 사업자별 교통수단 정보(항공, 버스, 지하철, DRT, 택시, 공유교통 등) \r\n및 실시간 위치·소요시간·비용 정보 수집·통합\r\nž (2단계) AI 알고리즘 기반 최적 교통수단 조합 및 경로 생성, 데이터 정합성 확보\r\nž (3단계) 표준 Open API를 통한 플랫폼 사업자·운송사업자 간 정보조회·교통예약 중계 \r\n및 시민 대상 통합 예약·결제 서비스 활용\r\n입력데이터( 신 규 ) ž 운송수단별 소요시간·비용 정보, 실시간 버스 위치 정보, 지하철 경로 정보, 사용자 \r\n위치 및 연락처 정보, 좌석·예약 정보\r\n출력데이터( 신 규 ) ž 복합 교통수단 추천 정보, 최적 경로 정보, 예약·결제 처리 결과, 실시간 대중교통 정보(정\r\n류장, 지하철역 위치 등), 이용자·서비스 제공자 상호 평점 정보\r\n후 보 K P I ( 신 규 )\r\nž 하나의 앱에서 다양한 교통 수단 예약 가능 이용률(%) ž 최적 경로 추천 정확도(%) ž 대중교통 이용 촉진율(%) ž 서비스 접속자 증가율(%)\r\n확 산 리 스 크 \r\n1 차 판 정 ( 신 규 )\r\nž 다수의 운송사업자·플랫폼사업자 간 데이터 조회 및 예약 연계를 위한 표준 Open API \r\n도입 수준 차이\r\nž 대중교통 소외지역 포함 연계성 및 목적지별 환승 할인 등 지자체별 정책 지원 수준 차이\r\nž 지자체·민간기업·교통기업 등 다수 주체 간 운영 거버넌스 차이\n□ 서비스 이미지","분류\r\n번호 12 도시 에너지 운영 유형 환경·에너지· 수자원\r\n서 비 스 개 요 ž 도시 단위의 에너지 수요관리를 통한 에너지 효율화 및 잉여에너지 거래가 가능한 서비스\r\n주 요 기 능\r\nž 도시 전체 에너지 통합 모니터링 및 최적화\r\nž 전기·열 지능형 공급망 구축 및 잉여에너지 거래\r\nž AMI·APP 기반 소비자·공급자 양방향 통합검침\r\nž 분산형전원·축열조·VPP 연계 에너지 피크관리\r\n목 표 ž 도시단위 에너지 통합관리와 최적운영을 통한 수요피크 저감 및 저비용·고효율 에너지\r\n도시 구현\r\n현 재 수 준\r\nž 지능형 에너지관리·VPP의 현 기술도입 단계 및 통합에너지운영 플랫폼의 R&D 단계\r\nž P2P 국내 실증사업과 VPP 국내 시범사업 및 다수의 해외 기술구현 사례 존재\r\nž 도시단위의 효율적인 에너지 운영·관리를 위한 관련 규 브, 소방시설, 유동인구\r\n출력데이터( 신 규 )\r\nž PM 운행량 시계열 분석 정보, PM 운행 집중 구역 정보, PM 사고 조회·통계 정보, PM 이용 조회·통계 정보, PM 불법 주정차 판정 정보, PM 불법 반납지역 정보, PM \r\n생활안전지도, PM 교통안전 집중 계도 구역, PM 교통안전시설 확충 제안 지역\r\n후 보 K P I ( 신 규 ) ž 모빌리티 안전사고 감소(서비스 도입 후 1년간 사고데이터 건수 비교)(%)\r\n확 산 리 스 크 \r\n1 차 판 정 ( 신 규 )\r\nž 민간 PM 운영사 보유 운행·사고 데이터 제공 협조 및 연계 범위에 대한 제약\r\nž 지자체별 스마트시티 데이터 표준모델 수립 및 NGSI-LD 표준화 수준 차이\r\nž 불법 주정차 판정 기준(시설물 10m 이내) 등 시설물·보호구역 운영 기준의 지자체 간 \r\n차이\n□ 서비스 이미지","분류\r\n번호 20 도시 재난 예방 서비스 유형 방범·방재\r\n서 비 스 개 요 ž 소방본부 MDT 데이터 및 날씨데이터 연계·분석을 통해 재난 예방 활동을 위한 정보 \r\n제공 서비스\r\n주 요 기 능\r\nž 119 MDT 데이터 및 날씨 데이터 수집·분석 기반 재난 유형별 상관관계 도출\r\nž GIS 기반 재난 데이터 종류별 주제도 및 재난 유형별 시각화 표출\r\nž 재난 사고 및 접수 다발 지역 재난 예방지역 설정\r\nž 재난부서 정보 제공(계정 부여) 및 재난 예방 활동·예방 교육 지원\r\n목 표 ž 재난 예방 순찰과 예방 교육을 통한 재난 안전 체감도 제고 및 도민의 재산·인명 사고 감소\r\n현 재 수 준\r\nž GIS 기반 재난 유형별 시각화 표출 및 재난 예방지역 설정 서비스 구축 완료\r\nž 전북특별자치도청 데이터허브 플랫폼 기반 운영, 향후 도시안전망 연계 시군 데이터 수집 \r\n대상 확대 계획\r\nž 경찰청 112 신고데이터 등 일부 재난안전 데이터의 타 시도 제공 사례 존재에도 미제공\r\n되는 한계 존재\r\nž 데이터 표준화가 각 시도별로 자체 정의됨에 따른 향후 데이터허브 목적 달성의 어려움 \r\n예상\r\n적 용 기 술 ž NGSI-LD, 클라우드 네이티브(쿠버네티스), API 게이트웨이, RPA, GIS, 빅데이터 분석\r\n서 비 스 대 상 ž 재난부서, 도민, 지방자치\r\n단체 적 용 사 례 ž 전북특별자치도\r\n추 정 비 용 ž 데이터허브 2.0 \r\n연계 가능성(신규)\r\nž (1단계) 소방본부 MDT 데이터(재난 접수일시, 재난 유형, 신고자명, 신고자 번호, 재난 \r\n위치, 신고 접수 내용), 날씨데이터(기온, 풍속, 습도, 지면온도), 도시안전망 데이터(112 \r\n순찰차, 112 긴급수배차량, 119 긴급구조 표준, 재난상황대응(NDMS), 법무부 위치추적, 시설물 조회) 수집·통합\r\nž (2단계) 계절별·요일별·시간대별·재난 유형별 상관관계 분석, GIS 기반 재난 유형별 시각화 \r\n및 데이터 정합성 확보\r\nž (3단계) 재난부서 정보 제공(계정 부여), 재난 예방지역 설정, 재난 예방 활동 및 예방 \r\n교육 서비스 활용\r\n입력데이터( 신 규 )\r\nž 재난 접수일시, 재난 유형, 접수자명, 신고자 번호, 재난 위치, 신고 접수 내용, 기온, 풍속(m/s), 습도, 지면온도, 소방긴급구조 정보, 기상특보 통보문, 지진 통보문, 112 \r\n순찰차 정보, 112 긴급수배차량 정보, 119 긴급구조 표준 정보, 재난상황대응\r\n(NDMS) 정보, 법무부 위치추적 정보, 시설물 조회 정보\r\n출력데이터( 신 규 ) ž GIS 기반 재난 유형별 시각화 정보, 재난 예방지역 설정 정보, 수집 데이터 통계, 재난부서 \r\n제공 데이터\r\n후 보 K P I ( 신 규 )\r\nž 재난 예방지역 설정 건수(건) ž 도시안전망 연계 필수 데이터 지정 건수(건) ž 재난부서 데이터 제공 건수(건)\r\n확 산 리 스 크 \r\n1 차 판 정 ( 신 규 )\r\nž 데이터 표준화가 각 시도별로 자체 정의됨에 따른 데이터허브 목
